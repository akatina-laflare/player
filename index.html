<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0c0f" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Studio Player</title>
<style>
/* Layout: libreria con titolo grande e schede (Brani / Cartelle / Preferiti), mini player fisso in basso,
   schermata di ascolto a foglio con forma d'onda, fogli d'azione dal basso per menu, coda e impostazioni */
:root{
  --bg:#f5f4f7; --surface:#ffffff; --raised:#ffffff; --fg:#151318; --muted:#706b78; --line:rgba(21,19,24,.09);
  --accent:#e2465f; --glass:rgba(248,247,250,.84); --chip:rgba(21,19,24,.06); --scrim:rgba(10,8,12,.38);
  --np-bg:#ffffff; --np-fg:#151318; --np-muted:#7a7582; --np-track:rgba(21,19,24,.16); --np-chip:rgba(21,19,24,.06);
  --danger:#d93636;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0c0f; --surface:#17151a; --raised:#35313a; --fg:#f4f2f6; --muted:#9b96a3; --line:rgba(255,255,255,.08);
  --glass:rgba(23,21,26,.84); --chip:rgba(255,255,255,.08); --scrim:rgba(0,0,0,.55); --danger:#ff6b6b;
  --np-bg:#000000; --np-fg:#f4f2f6; --np-muted:#9b96a3; --np-track:rgba(255,255,255,.18); --np-chip:rgba(255,255,255,.09); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0c0f; --surface:#17151a; --raised:#35313a; --fg:#f4f2f6; --muted:#9b96a3; --line:rgba(255,255,255,.08);
  --glass:rgba(23,21,26,.84); --chip:rgba(255,255,255,.08); --scrim:rgba(0,0,0,.55); --danger:#ff6b6b;
  --np-bg:#000000; --np-fg:#f4f2f6; --np-muted:#9b96a3; --np-track:rgba(255,255,255,.18); --np-chip:rgba(255,255,255,.09); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg{display:block;flex:none}

.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:6px 130px}
.navbar{position:fixed;left:0;right:0;top:0;z-index:6;padding:env(safe-area-inset-top,0px) 12px 0;background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border-bottom:1px solid var(--line);transform:translateY(-100%);opacity:0;transition:transform .25s ease,opacity .2s ease;pointer-events:none}
.navbar.show{transform:none;opacity:1;pointer-events:auto}
.nav-in{max-width:720px;margin:0 auto;height:48px;display:flex;align-items:center;gap:4px}
.nav-t{flex:1;min-width:0;text-align:center;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.nav-in>.top-btns{flex:none}
.top{display:flex;flex-direction:column;gap:2px;padding-block:14px 8px}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-size:16px;padding:4px 0;align-self:flex-start}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-size:32px;font-weight:700;letter-spacing:-.02em;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-btns{display:flex;gap:4px}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:50%}
.ib:active{background:var(--chip)}
.acc{color:var(--accent)}

.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:10px;padding:2px;margin:6px 0 12px}
.seg button{padding:7px 4px;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--raised);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:11px;padding:9px 11px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:inherit;font-size:16px;outline:none}
.sortb{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:11px;padding:9px 11px;color:var(--fg);font-size:14px;white-space:nowrap}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 4px}
.pill{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--chip);color:var(--accent);font-weight:600;border-radius:12px;padding:12px}
.pill:active{opacity:.7}

.fhead{display:flex;gap:16px;align-items:flex-end;margin:4px 0 6px}
.fhead .art{width:132px;height:132px;border-radius:12px;flex:none;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.fhead .info{min-width:0;display:flex;flex-direction:column;gap:4px}
.fhead .path{font-size:13px;color:var(--muted);overflow-wrap:anywhere}

.list{list-style:none;margin:6px 0 0;padding:0}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:7px 0;cursor:pointer;border-radius:8px;position:relative;touch-action:pan-y}
.row>.art,.row>.meta{transform:translateX(var(--sx,0px));transition:transform .45s cubic-bezier(.34,1.4,.64,1)}
.row.swiping>.art,.row.swiping>.meta{transition:none}
.row .qbg{position:absolute;left:0;top:4px;bottom:4px;width:0;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;opacity:0;pointer-events:none;overflow:hidden}
.row .qbg.back{transition:width .45s cubic-bezier(.34,1.4,.64,1),opacity .35s ease}
.row .qbg svg{width:22px;height:22px;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.row .qbg.arm svg{transform:scale(1.25)}
.row .qbg.done{transition:opacity .5s ease .25s;opacity:0!important}
.row:active{background:var(--chip)}
.art{position:relative;overflow:hidden;display:grid;place-items:center;background-size:cover;background-position:center}
.row .art{width:50px;height:50px;border-radius:7px;flex:none}
.row .meta{flex:1;min-width:0;border-bottom:1px solid var(--line);align-self:stretch;display:flex;align-items:center;gap:6px;padding-block:4px}
.row:last-child .meta{border-bottom-color:transparent}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.row.playing .t{color:var(--accent);font-weight:600}
.heart{color:var(--accent)}
.more{width:36px;height:40px;display:grid;place-items:center;color:var(--muted);border-radius:8px}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin-right:6px;vertical-align:1px}
.tag.ll{color:var(--accent);border-color:currentColor}
.bars{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:14px;background:rgba(0,0,0,.4)}
.bars i{width:4px;background:#fff;border-radius:2px;height:8px;animation:eq .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:-.3s}.bars i:nth-child(3){animation-delay:-.6s}
.paused .bars i{animation-play-state:paused}
@keyframes eq{0%,100%{height:6px}50%{height:22px}}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes artIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes miniIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes toastIn{from{transform:translate(-50%,12px)}to{transform:translate(-50%,0)}}
.list.anim .row{animation:rowIn .32s cubic-bezier(.2,.8,.2,1) both}
.grid.anim .card{animation:rowIn .36s cubic-bezier(.2,.8,.2,1) both}
.pop{animation:pop .38s cubic-bezier(.3,1.6,.5,1)}
.big.swap{animation:artIn .42s cubic-bezier(.2,.8,.2,1)}
.mini.enter{animation:miniIn .35s cubic-bezier(.2,.8,.2,1)}
.toast.show{animation:toastIn .25s ease-out}
.ib,.pill,.chip,.card,.btn,.sw{transition:transform .28s cubic-bezier(.2,.8,.2,1),background .2s,opacity .2s}
.ib:active,.pill:active,.chip:active,.btn:active{transform:scale(.94);transition-duration:.12s}
.ctrl .play:active{transform:scale(.9)}
.still .up-item{animation:none}
.row .art{transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.row:active .art{transform:scale(.94)}
.cover-note{width:42%;height:42%;color:rgba(255,255,255,.6)}
:root{--cov-bg:#e9e9ec;--cov-note:#b3b3b8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cov-bg:#2a292f;--cov-note:#636268}}
:root[data-theme="dark"]{--cov-bg:#2a292f;--cov-note:#636268}
.cov-classica .cover-note{color:var(--cov-note)}
.cov-classica .art:not([style*="url("]){box-shadow:inset 0 0 0 1px rgba(127,127,135,.18)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px;margin-top:8px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.card .art{width:100%;aspect-ratio:1;max-width:100%;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.card .t{font-size:15px;font-weight:500}
.card:active .art{transform:scale(.97)}

.jampill{display:inline-flex;align-items:center;gap:8px;margin:0 0 10px;padding:6px 13px 6px 11px;border-radius:999px;background:var(--chip);color:var(--accent);font-size:14px;font-weight:600;max-width:100%}
.jampill[hidden],.card-np[hidden]{display:none}
.jampill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jampill i{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;animation:jamDot 1.6s ease-in-out infinite}
.jampill.warn{background:var(--accent);color:#fff}.jampill.warn i{background:#fff}
@keyframes jamDot{50%{opacity:.25}}
.ib.on{background:var(--accent);color:#fff!important}
.jamcode{font-family:var(--mono);font-size:40px;font-weight:700;letter-spacing:.14em;text-align:center;margin:4px 0 0;color:var(--accent)}
.swhint{position:fixed;left:50%;top:40%;display:flex;align-items:center;gap:8px;max-width:72vw;transform:translate(-50%,-50%) scale(.9);background:rgba(18,16,22,.58);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);color:#fff;font-weight:700;font-size:18px;padding:11px 18px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .16s,transform .16s,background .2s;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.swhint b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swhint svg{width:20px;height:20px;flex:none}
.swhint.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.swhint.track{background:var(--accent);font-size:16px}
.swhint.pop{animation:swPop .26s cubic-bezier(.34,1.56,.64,1)}
.swhint.out{animation:swOut .72s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes swPop{from{transform:translate(-50%,-50%) scale(.72)}to{transform:translate(-50%,-50%) scale(1)}}
@keyframes swOut{0%{opacity:1;transform:translate(-50%,-50%) scale(1.14)}30%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-95%) scale(.94)}}
.swrip{position:fixed;overflow:hidden;pointer-events:none;z-index:59}
.swrip i{position:absolute;top:50%;width:150%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.42),rgba(255,255,255,0) 68%);transform:translate(-50%,-50%) scale(0);animation:swRip .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes swRip{60%{opacity:1}to{transform:translate(-50%,-50%) scale(1);opacity:0}}
.big.spring{transition:transform .58s cubic-bezier(.34,1.56,.64,1),opacity .3s ease}
.dupbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--chip);border-radius:14px;padding:10px 10px 10px 14px;margin:10px 0 4px}
.dupbar span{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px}
.dupbar svg{color:var(--danger);flex:none}
.dupbar .btn{padding:9px 14px;font-size:14px;background:var(--danger)}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:22px 18px;margin:14px 0;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty h2{margin:0;font-family:var(--display);font-size:20px;letter-spacing:-.01em}
.empty p{margin:0;color:var(--muted);line-height:1.45;max-width:52ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;font-weight:600;border-radius:12px;padding:12px 16px}
.btn.ghost{background:var(--chip);color:var(--accent)}
.btn:active{opacity:.8}
.none{color:var(--muted);text-align:center;padding:28px 10px}

/* mini player */
.mini{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border-top:1px solid var(--line);z-index:5}
.mini-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:6px}
.mini .open{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.mini .art{width:44px;height:44px;border-radius:7px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.mini .txt{min-width:0}
.mini .t{font-size:15px;font-weight:500}
.mini-prog{position:absolute;left:0;top:-1px;height:2px;background:var(--accent);width:0}

/* schermata di ascolto */
.np{position:fixed;inset:0;z-index:10;color:var(--np-fg);background:var(--np-bg);transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);overflow:hidden;visibility:hidden}
.np.open{transform:none;visibility:visible}
.np.drag{transition:none}
.np-bg{display:none;position:absolute;inset:-20%;filter:blur(60px) saturate(1.2);transform:scale(1.2);background-size:cover;background-position:center}
.np-bg::after{content:"";position:absolute;inset:0;background:rgba(10,8,12,.5)}
.np-in{position:relative;height:100%;overflow-y:auto;overscroll-behavior:contain;max-width:480px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top,0px)) 22px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.np-in>*{flex:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--np-track);margin:4px auto 0;flex:none;position:relative}
#npIn>.grab::after{content:"";position:absolute;inset:-14px -40px}
.np-head{display:flex;justify-content:space-between;align-items:center}
.np .ib{color:var(--np-fg)}
.np .ib:active{background:var(--np-chip)}
.np-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--np-muted);font-weight:600;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{width:100%;max-width:340px;aspect-ratio:1;margin:4px auto 0;border-radius:14px;box-shadow:0 24px 50px rgba(0,0,0,.42);transition:transform .35s ease}
.np.paused .big{transform:scale(.88)}
.big{box-shadow:0 18px 40px rgba(0,0,0,.22)}
.np-title{display:flex;align-items:center;gap:6px}
.np-title .txt{flex:1;min-width:0}
.np-title .t{font-size:21px;font-weight:700}
.np-title .s{color:var(--np-muted);font-size:16px}
.scrub{position:relative;padding-block:14px;margin-block:-14px;touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none}
.pbar{position:relative;height:7px;border-radius:4px;background:var(--np-track);overflow:hidden;pointer-events:none;transition:height .18s ease,margin .18s ease}
.scrub.active .pbar{height:13px;margin-block:-3px}
.pfill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--np-fg);opacity:.85}
.scrub.active .pfill{opacity:1}
.pab{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.35}
.bubble{position:absolute;bottom:calc(100% - 4px);transform:translateX(-50%);background:var(--np-fg);color:var(--np-bg);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.2);white-space:nowrap}
.bubble b{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums}
.bubble span{font-size:11px;opacity:.7}
.bubble span:empty{display:none}
.times{display:flex;justify-content:space-between;font-size:12px;font-weight:500;color:var(--np-muted);font-variant-numeric:tabular-nums;margin-top:8px}
.scrub.active+.times{color:var(--np-fg)}
.ctrl{display:flex;justify-content:space-around;align-items:center}
.ctrl .ib{width:64px;height:64px}
.ctrl .play{width:82px;height:82px}
.vol{display:flex;align-items:center;gap:10px;color:var(--np-muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:none;margin:0;--p:100%}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(var(--np-muted),var(--np-muted)) 0/var(--p) 100% no-repeat,var(--np-track)}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--np-track)}
input[type=range]::-moz-range-progress{height:5px;border-radius:3px;background:var(--np-muted)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--np-fg);margin-top:-4.5px}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--np-fg)}
.chips{display:flex;justify-content:space-around;align-items:center}
.chip{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;min-width:48px;height:44px;padding:0 10px;border-radius:22px;color:var(--np-muted);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.chip svg{width:22px;height:22px}
.chip.on{color:var(--accent);background:var(--np-chip)}
#repL,#speedBtn,#abBtn{display:none}
#rep.one::after{content:"1";position:absolute;top:6px;right:8px;font-size:9px;font-weight:800;color:var(--accent)}
#timerL:not(:empty){margin-left:2px}
#npFav[aria-pressed="true"]{color:var(--accent)}
.upnext{display:flex;flex-direction:column;gap:4px}
.up-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.up-all{font-size:13px;font-weight:600;color:var(--accent)}
.up-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:6px 4px;border-radius:10px;animation:rowIn .3s cubic-bezier(.2,.8,.2,1) both}
.up-item:active{background:var(--np-chip)}
.up-item .art{width:44px;height:44px;border-radius:6px;flex:none}
.up-item .txt{flex:1;min-width:0}
.up-item .t{font-size:15px;font-weight:500}
.up-item .s{color:var(--np-muted)}
.up-item .q{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.big{touch-action:pan-y;will-change:transform}
.big.slide{transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s ease}
.card-np{background:var(--np-chip);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--np-muted);font-family:var(--mono)}
.kv b{color:var(--np-fg);font-weight:600}
.notes textarea{width:100%;min-height:96px;resize:vertical;border:0;border-radius:10px;padding:10px;background:var(--np-chip);color:var(--np-fg);font:inherit;font-size:15px;line-height:1.45}
.notes textarea::placeholder{color:var(--np-muted)}

/* fogli dal basso */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);color:var(--fg);border-radius:16px 16px 0 0;max-height:86%;overflow-y:auto;overscroll-behavior:contain;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:6px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.show{transform:none}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet .grab{background:var(--line)}
.sh-head{display:flex;align-items:center;gap:12px}
.sh-head .art{width:52px;height:52px;border-radius:8px;flex:none}
.sh-head .txt{min-width:0;flex:1}
.sh-title{font-family:var(--display);font-size:20px;font-weight:700;margin:0}
.opts{display:flex;flex-direction:column;background:var(--chip);border-radius:12px;overflow:hidden}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:16px}
.opt:last-child{border-bottom:0}
.opt:active{background:var(--line)}
.opt .lbl{flex:1;min-width:0}
.opt .hint{color:var(--muted);font-size:14px}
.opt.danger{color:var(--danger)}
.opt>svg,.opt>.acc>svg{color:var(--accent);flex:none}
.opt.danger>svg{color:var(--danger)}
.opt.sel{color:var(--accent);font-weight:600}
.sec{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:4px 2px -6px}
.note{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.swatches{display:flex;gap:12px;flex-wrap:wrap;padding:4px 2px}
.sw{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.sw[aria-pressed="true"]{outline:3px solid var(--fg);outline-offset:2px}
.segs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--chip);border-radius:10px;padding:2px}
.segs button{padding:8px 4px;border-radius:8px;font-size:14px;color:var(--muted)}
.segs button[aria-pressed="true"]{background:var(--raised);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{width:100%;font:inherit;font-size:17px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.toggle{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.toggle[aria-checked="true"]{background:var(--accent)}
.toggle[aria-checked="true"]::after{transform:translateX(20px)}
.q-now{color:var(--accent)}
.x{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--muted);flex:none}

.prog{position:fixed;left:16px;right:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;background:var(--raised);color:var(--fg);border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:25;display:flex;flex-direction:column;gap:8px}
.prog .bar{height:5px;border-radius:3px;background:var(--chip);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.vh{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;overflow:hidden}
.pick{position:relative;overflow:hidden}
.pick>input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px}
.card.add .art{background:var(--chip);box-shadow:none;border:1.5px dashed var(--line);color:var(--accent)}
.card.add .t{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
.drop{position:fixed;inset:12px;border:3px dashed var(--accent);border-radius:20px;background:var(--glass);z-index:50;display:grid;place-items:center;font-size:20px;font-weight:600;color:var(--accent);pointer-events:none}
@media (min-width:700px){.fhead .art{width:180px;height:180px}}
@media (prefers-reduced-motion: reduce){.list.anim .row,.grid.anim .card,.pop,.big.swap,.mini.enter,.toast.show{animation:none}.np,.big,.sheet,.scrim{transition:none}.bars i{animation:none;height:12px}}
</style>

  if(seekHold){if(Math.abs(ct-seekHold.t)<.6||now>seekHold.until)seekHold=null;else return seekHold.t}
  if(audio.paused||audio.seeking||audio.readyState<3){stA=ct;stW=now;stL=ct;return ct}
  const r=audio.playbackRate||1,pred=stA+(now-stW)/1000*r;
  if(ct!==stL){stL=ct;if(Math.abs(pred-ct)>.3){stA=ct;stW=now}else{stA=pred*.85+ct*.15;stW=now}}
  const v=stA+(now-stW)/1000*r;return d?Math.min(d,v):v}
function holdSeek(t){seekHold={t,until:performance.now()+2500};stA=t;stW=performance.now()}

const wv=$('wave'),zone=$('scrubZone');
/* trascinamento relativo: il punto parte da dove tocchi, poi segue il dito.
   Se allontani il dito in verticale, lo scorrimento rallenta (metà, poi un quarto) per la precisione. */
let sd=null;
function wfrac(e){const r=wv.getBoundingClientRect();return Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))}
function showBubble(){const b=$('bubble'),r=wv.getBoundingClientRect(),d=audio.duration||(S.byId.get(S.curId)||{}).duration||0;
  b.hidden=true;$('scrubHint').textContent=sd&&sd.speed<1?(sd.speed===.5?'Scorrimento lento':'Scorrimento fine'):'';$('bubT').textContent=fmt((scrub||0)*d);$('bubS').textContent=sd&&sd.speed<1?(sd.speed===.5?'Scorrimento lento':'Scorrimento fine'):'';
  const x=Math.min(r.width-40,Math.max(40,(scrub||0)*r.width));b.style.left=x+'px'}
zone.addEventListener('pointerdown',e=>{if(!S.curId)return;e.preventDefault();try{zone.setPointerCapture(e.pointerId)}catch(x){}
  const d=audio.duration||(S.byId.get(S.curId)||{}).duration||0;const cur=d?Math.min(1,smoothTime()/d):wfrac(e);
  scrub=cur;sd={x:e.clientX,y:e.clientY,f:cur,speed:1,w:wv.getBoundingClientRect().width,t0:performance.now(),tap:wfrac(e),moved:false};zone.classList.add('active');progress();showBubble()});
zone.addEventListener('pointermove',e=>{if(scrub==null||!sd)return;const dy=Math.abs(e.clientY-sd.y);const sp=dy>140?.25:dy>70?.5:1;
  if(Math.abs(e.clientX-sd.x)>4||dy>6)sd.moved=true;
  if(sp!==sd.speed){sd.f=scrub;sd.x=e.clientX;sd.speed=sp}
  scrub=Math.min(1,Math.max(0,sd.f+(e.clientX-sd.x)/sd.w*sp));if(!sd.raf)sd.raf=requestAnimationFrame(()=>{if(sd)sd.raf=0;progress();showBubble()})});

  if(d){const t=Math.min(d-.05,scrub*d);holdSeek(t);try{audio.currentTime=t}catch(x){}}scrub=null;sd=null;zone.classList.remove('active');$('bubble').hidden=true;$('scrubHint').textContent='';progress()};
zone.addEventListener('pointerup',endScrub);zone.addEventListener('pointercancel',endScrub);zone.addEventListener('lostpointercapture',endScrub);

(()=>{const np=$('np'),inn=$('npIn');let st=null;
  inn.addEventListener('touchstart',e=>{if(e.target.closest('.scrub')||e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'){st=null;return}
    const t=e.touches[0];st={x:t.clientX,y:t.clientY,t:Date.now(),top:inn.scrollTop<=0,dir:null,dy:0}},{passive:true});
  inn.addEventListener('touchmove',e=>{if(!st)return;const t=e.touches[0],dx=t.clientX-st.x,dy=t.clientY-st.y;
    if(!st.dir&&(Math.abs(dx)>8||Math.abs(dy)>8))st.dir=Math.abs(dy)>Math.abs(dx)?'v':'h';

/* scorri sulla copertina per cambiare brano */
function swipeable(el,opt){let x0=null,y0=0,dx=0,dir=null,moved=false,vx=0,lx=0,lt=0;
  el.addEventListener('touchstart',e=>{if(!S.curId)return;x0=lx=e.touches[0].clientX;y0=e.touches[0].clientY;lt=performance.now();vx=0;dx=0;dir=null;moved=false;el.classList.remove('slide')},{passive:true});
  el.addEventListener('touchmove',e=>{if(x0==null)return;const cx=e.touches[0].clientX,now=performance.now();if(now>lt){vx=(cx-lx)/(now-lt)*.6+vx*.4;lx=cx;lt=now}
    const mx=cx-x0,my=e.touches[0].clientY-y0;
    if(!dir&&(Math.abs(mx)>8||Math.abs(my)>8))dir=Math.abs(mx)>Math.abs(my)?'h':'v';
    if(dir!=='h')return;moved=true;dx=mx;if(opt.move)opt.move(dx)},{passive:true});
  const end=()=>{if(x0==null)return;x0=null;if(dir!=='h'){if(opt.reset)opt.reset();return}
    if(opt.end){opt.end(dx,performance.now()-lt>120?0:vx);return}
    if(dx<-opt.th){opt.go(1)}else if(dx>opt.th){opt.go(-1)}else if(opt.reset)opt.reset()};
  el.addEventListener('touchend',end);el.addEventListener('touchcancel',()=>{x0=null;if(opt.reset)opt.reset()});
  el.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopPropagation();moved=false}},true)}
(()=>{const big=$('bigArt');
  const set=(x,o)=>{big.style.transform=x==null?'':`translateX(${x}px) rotate(${x/40}deg)`;big.style.opacity=o==null?'':o};
  /* scorrimento sulla copertina: breve = ±5 s (sinistra avanti, destra indietro), lungo = cambia brano */
  const hint=document.createElement('div');hint.className='swhint';document.body.appendChild(hint);
  let swz=null,hintT=null;
  const FF='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6v12l8.5-6zM12 6v12l8.5-6z"/></svg>',RW='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 6v12l-8.5-6zM12 6v12l-8.5-6z"/></svg>';

    hint.innerHTML=z==='track'?`${dx<0?FF:RW}<b>${esc(tname(dx<0?1:-1))}</b>`:`${fwd?FF:RW}<b>${fwd?'+':'−'}5 s</b>`;
    hint.classList.toggle('track',z==='track');hint.classList.add('show');hint.classList.remove('pop');void hint.offsetWidth;hint.classList.add('pop');
    try{navigator.vibrate&&navigator.vibrate(6)}catch(e){}};
  const ripple=fwd=>{const r=big.getBoundingClientRect(),w=document.createElement('div');w.className='swrip';
    Object.assign(w.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',borderRadius:getComputedStyle(big).borderRadius});
    w.innerHTML=`<i style="left:${fwd?86:14}%"></i>`;document.body.appendChild(w);setTimeout(()=>w.remove(),750)};
  const FULL=()=>Math.max(110,big.clientWidth*.42),SMALL=24;
  const kind=(dx,v)=>{const a=Math.abs(dx),F=FULL();return a>=F||(a>=F*.75&&Math.abs(v)>1.4)?'track':a>=SMALL?'seek':null};
  const follow=dx=>{const F=FULL(),a=Math.abs(dx),sg=Math.sign(dx);const tx=a<F?dx*.85:sg*(F*.85+(a-F)*.55);

  const goTrack=d=>{const w=big.clientWidth+80;big.classList.remove('spring');big.classList.add('slide');set(d>0?-w:w,'0');
      setTimeout(()=>{big.classList.remove('slide');big.style.transform=`translateX(${d>0?w*.6:-w*.6}px) scale(.88)`;big.style.opacity='0';

  for(const t of S.tracks){if(t.demo)continue;const k=normName(t.file||t.name)+'|'+lastSeg(t.folder||'').toLowerCase();if(!groups.has(k))groups.set(k,[]);groups.get(k).push(t)}
  const out=[];for(const g of groups.values())if(g.length>1){g.sort((a,b)=>srcRank(b)-srcRank(a)||(b.offline?1:0)-(a.offline?1:0));const keep=g[0];
    const drop=g.slice(1).filter(o=>o.src!==keep.src||o.size===keep.size);if(drop.length)out.push({keep,drop})}
  /* stesso nome in cartelle con nome diverso tra servizi diversi: confronta per nome e dimensione */
  const seen=new Set(out.flatMap(d=>[d.keep.id,...d.drop.map(x=>x.id)]));const bySize=new Map();
  for(const t of S.tracks){if(t.demo||seen.has(t.id))continue;const k=normName(t.file||t.name)+'|'+(t.size||0);if(!bySize.has(k))bySize.set(k,[]);bySize.get(k).push(t)}
  for(const g of bySize.values())if(g.length>1){g.sort((a,b)=>srcRank(b)-srcRank(a));out.push({keep:g[0],drop:g.slice(1)})}
  return out}
const dupeCount=()=>findDupes().reduce((a,d)=>a+d.drop.length,0);
async function dedupe(quiet){const ds=findDupes();if(!ds.length){if(!quiet)toast('Nessun doppione');return 0}
  const h=new Set(hiddenIds());let n=0;const ids=[];
  for(const{keep,drop}of ds){for(const d of drop){if(d.fav)keep.fav=true;keep.plays=(keep.plays||0)+(d.plays||0);if(!keep.cover&&d.cover)keep.cover=d.cover;
      const nt=ls.get('sp-notes:'+d.id);if(nt&&!ls.get('sp-notes:'+keep.id))ls.set('sp-notes:'+keep.id,nt);
      if(d.id===S.curId){S.curId=null;audio.pause();$('mini').hidden=true}
      if(isCloud(d))h.add(d.id);ids.push(d.id);n++}
    await saveTrack(keep)}
  ls.set('sp-hidden',JSON.stringify([...h]));await removeTracks(ids,true);
  if(!quiet)toast(n===1?'1 doppione rimosso':`${n} doppioni rimossi`);return n}

async function dbxTokenReq(params){const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body:new URLSearchParams({client_id:DBX_KEY,...params})});
  if(!r.ok)throw Object.assign(new Error('token'),{status:r.status});return r.json()}
const tokP=new Map();
async function dbxToken(ac,force){if(!ac||!ac.refresh)throw new Error('nolink');if(!force&&ac.access&&Date.now()<ac.exp-60000)return ac.access;
  if(!tokP.has(ac))tokP.set(ac,dbxTokenReq({grant_type:'refresh_token',refresh_token:ac.refresh}).then(j=>{ac.access=j.access_token;ac.exp=Date.now()+j.expires_in*1000;saveAccts();return ac.access},
    e=>{if(e.status===400||e.status===401){ac.refresh=null;ac.access=null;saveAccts();toast(`Dropbox "${acctLabel(ac)}" si è scollegato: ricollegalo dalle impostazioni`,4200)}throw e}).finally(()=>tokP.delete(ac)));
  return tokP.get(ac)}
async function dbxFetch(ac,url,init,retry=true){const tok=await dbxToken(ac);const r=await fetch(url,{...init,headers:{...(init.headers||{}),Authorization:'Bearer '+tok}});
  if(r.status===401&&retry){await dbxToken(ac,true);return dbxFetch(ac,url,init,false)}
  if(r.status===429&&retry){await new Promise(z=>setTimeout(z,(+r.headers.get('Retry-After')||2)*1000));return dbxFetch(ac,url,init,false)}
  if(!r.ok&&r.status!==206){let t='';try{t=await r.text()}catch(e){}throw Object.assign(new Error('dbx '+r.status+' '+t.slice(0,200)),{status:r.status,body:t})}return r}
async function dbxApi(ac,path,body){const init={method:'POST'};if(body!==undefined){init.headers={'Content-Type':'application/json'};init.body=JSON.stringify(body)}
  return (await dbxFetch(ac,'https://api.dropboxapi.com/2/'+path,init)).json()}

function remoteBlob(t){let head=null;const HEAD=262144;
  const get=async(a,b)=>{if(b<=HEAD&&t.size>0){if(!head)head=await cloudRange(t,0,Math.min(HEAD,t.size)-1);return head.slice(a,Math.min(b,head.byteLength))}return cloudRange(t,a,Math.min(b,t.size)-1)};
  return{size:t.size,type:'',slice:(a,b)=>({arrayBuffer:()=>get(a,b)})}}

async function dbxSync(manual){if(dbxSyncing)return;
  const live=SET.dbxFolders.filter(f=>{const a=acctById(f.acct);return a&&a.refresh});if(!live.length)return;dbxSyncing=true;
  const P=$('prog'),PT=$('progT'),PB=$('progBar');if(manual){P.hidden=false;PT.textContent='Controllo Dropbox…';PB.style.width='15%'}
  try{const seen=new Set(),okKeys=new Set(),fails=[];let added=0,updated=0,nAud=0;const fresh=[];const hid=new Set(hiddenIds());let fi=0;
    for(const f of live){const ac=acctById(f.acct),k=fkey(f);if(manual)PB.style.width=(15+70*fi++/live.length)+'%';
      let ents;try{ents=await dbxList(ac,f)}catch(e){fails.push({f,e});continue}

      for(const e of aud){const id='dbx:'+e.id;if(hid.has(id)||seen.has(id))continue;seen.add(id);const folder=dbxFolderOf(f,e);let t=S.byId.get(id);
        if(!t){t={id,src:'dbx',acct:ac.id,root:k,dbxId:e.id,hash:e.content_hash,path:e.path_display,name:clean(e.name),file:e.name,folder,size:e.size,added:Date.parse(e.server_modified)||Date.now(),plays:0,fav:false,info:{fmt:extOf(e.name).toUpperCase(),lossless:/^(wav|wave|aif|aiff|aifc|flac)$/.test(extOf(e.name))}};
          S.tracks.push(t);S.byId.set(id,t);added++;fresh.push(t);await saveTrack(t)}
        else{let ch=false;if(t.hash!==e.content_hash){t.hash=e.content_hash;t.size=e.size;t.file=e.name;delete t.peaks;t.duration=0;t.info={fmt:extOf(e.name).toUpperCase()};delete tempLinks[id];
            await cacheDel(id);if(t.offline){await idb.del('blobs',id);t.offline=false}updated++;fresh.push(t);ch=true}
          if(t.path!==e.path_display||t.folder!==folder||t.acct!==ac.id||t.root!==k){if(t.acct!==ac.id)delete tempLinks[id];t.path=e.path_display;t.folder=folder;t.acct=ac.id;t.root=k;ch=true}
          if(ch)await saveTrack(t)}}
      const byF={};imgs.forEach(e=>{const fo=dbxFolderOf(f,e);(byF[fo]=byF[fo]||[]).push(e)});
      for(const[fo,list]of Object.entries(byF)){const pick=list.find(x=>/^(cover|folder|artwork|front|copertina|album)\b/i.test(x.name))||list[0];
        if(S.covers[fo]&&ls.get('sp-cvh:'+fo)===pick.content_hash)continue;
        try{const d=await imgToData(await dbxDownload(ac,pick.id));if(d){S.covers[fo]=d;await idb.put('meta',d,'cover:'+fo);ls.set('sp-cvh:'+fo,pick.content_hash)}}catch(e){}}}
    const keys=new Set(SET.dbxFolders.map(fkey));
    // tolgo solo i brani spariti da cartelle lette senza errori (o di cartelle/account non più collegati)
    const gone=S.tracks.filter(t=>t.src==='dbx'&&!seen.has(t.id)&&(t.root?(okKeys.has(t.root)||!keys.has(t.root)):!fails.length)).map(t=>t.id);
    if(gone.length)await removeTracks(gone,true);
    if(own().length&&S.tracks.some(t=>t.demo)){if(S.byId.get(S.curId)?.demo){audio.pause();S.curId=null;$('mini').hidden=true}S.tracks=S.tracks.filter(t=>!t.demo);S.byId=new Map(S.tracks.map(t=>[t.id,t]))}
    if(okKeys.size)ls.set('sp-dbx-last',String(Date.now()));render();if(S.curId)updateNow();
    const parts=[];if(added)parts.push(added===1?'1 brano nuovo':`${added} brani nuovi`);if(updated)parts.push(updated===1?'1 aggiornato':`${updated} aggiornati`);if(gone.length)parts.push(`${gone.length} tolti`);
    const miss=fails.filter(x=>x.e&&x.e.status===409);
    if(miss.length)toast(`Non trovo più ${miss.length===1?'la cartella "'+miss[0].f.name+'"':miss.length+' cartelle'} su Dropbox: controlla nelle impostazioni`,4500);
    else if(fails.length&&(manual||fails.some(x=>x.e.message!=='nolink'))&&!okKeys.size)toast('Dropbox non risponde: riprovo quando riapri il player',3500);
    else if(parts.length)toast('Dropbox: '+parts.join(' · '),3200);
    else if(manual)toast(nAud?'Dropbox: tutto aggiornato':live.length===1?`Nella cartella "${live[0].name}" non ci sono ancora brani`:'Nelle cartelle Dropbox non ci sono ancora brani',3200);
    if(!miss.length&&parts.length&&fails.length&&manual)toast('Dropbox: '+parts.join(' · ')+' (una cartella non ha risposto)',3600);
    dbxDetails(fresh);if(SET.dbxKeep)dbxKeepAll();if(SET.autoDedupe!==false)setTimeout(()=>dedupe(true).then(n=>{if(n)toast(n===1?'1 doppione nascosto':`${n} doppioni nascosti`)}),1200)}
  catch(e){if(manual)toast('Dropbox non risponde: riprovo quando riapri il player',3500)}
  finally{dbxSyncing=false;setTimeout(()=>{P.hidden=true},300)}}

let keepBusy=false;

/* ================= Jam: ascoltare insieme =================
   Ognuno ascolta dal suo telefono la stessa canzone nello stesso momento.
   Chi avvia la Jam (host) comanda la musica; gli altri seguono e possono chiedere brani.
   I messaggi passano da ntfy.sh (servizio pubblico gratuito) cifrati con AES-GCM:
   la chiave nasce dal codice della Jam e non lascia mai i telefoni. */
const JAM_SRV='https://ntfy.sh/';
const JAM_AB='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
var jam=null;
const jamMe=(()=>{let v=ls.get('sp-jam-me');if(!v){v=uid();ls.set('sp-jam-me',v)}return v})();
const ICON_JAM=z=>`<svg${z?` width="${z}" height="${z}"`:''} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.6 14.6c2.5.3 4.4 2.2 4.4 4.9"/></svg>`;
const jamNet={
  pub:async(topic,body)=>{const r=await fetch(JAM_SRV+topic,{method:'POST',body});if(!r.ok)throw Object.assign(new Error('jam '+r.status),{status:r.status})},
  sub:(topic,since,onMsg,onErr)=>{const es=new EventSource(JAM_SRV+topic+'/sse'+(since?'?since='+encodeURIComponent(since):''));
    es.onmessage=e=>{try{const d=JSON.parse(e.data);if(d&&d.message)onMsg(d)}catch(x){}};es.onerror=()=>onErr&&onErr();return()=>es.close()}};
const jEnc=new TextEncoder();
const jSha=async s=>new Uint8Array(await crypto.subtle.digest('SHA-256',jEnc.encode(s)));
async function jamKeys(code){const h=await jSha('studio-player-jam|topic|'+code);
  const topic='spjam_'+[...h.slice(0,16)].map(x=>x.toString(16).padStart(2,'0')).join('');
  const key=await crypto.subtle.importKey('raw',await jSha('studio-player-jam|key|'+code),'AES-GCM',false,['encrypt','decrypt']);return{topic,key}}
async function jamSeal(o,key){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,jEnc.encode(JSON.stringify(o))));
  const a=new Uint8Array(12+ct.length);a.set(iv);a.set(ct,12);let s='';for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
async function jamUnseal(s,key){const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12))))}
const jamNewCode=()=>[...crypto.getRandomValues(new Uint8Array(6))].map(x=>JAM_AB[x%32]).join('');
const jamFmt=c=>c.slice(0,3)+' '+c.slice(3);
function jamParse(v){v=String(v||'');const m=v.match(/jam=([A-Za-z0-9]{6})/);if(m)v=m[1];v=v.toUpperCase().replace(/[^A-Z0-9]/g,'');return/^[A-HJ-NP-Z2-9]{6}$/.test(v)?v:null}
const jamName=()=>SET.jamName||((accts[0]&&accts[0].name)||'').split(' ')[0]||'Ospite';
const jamKey=t=>t.hash?'h:'+String(t.hash).slice(0,24):'n:'+normName(t.name);
function jamFind(k,n){const c=S.tracks.filter(t=>!t.demo);let t=k?c.find(t=>jamKey(t)===k):null;if(!t&&n){const nn=normName(n);t=c.find(t=>normName(t.name)===nn)}return t||null}
const jamIsHost=()=>!!jam&&jam.role==='host',jamIsGuest=()=>!!jam&&jam.role==='guest';
function jamSave(){if(jam)ls.set('sp-jam',JSON.stringify({code:jam.code,role:jam.role,lastId:jam.lastId,at:Date.now()}))}
async function jamSend(o,j=jam){if(!j)return;o.from=jamMe;o.who=jamName();o.ts=Date.now();
  try{await jamNet.pub(j.topic,await jamSeal(o,j.key));j.fails=0}
  catch(e){j.fails=(j.fails||0)+1;if(jam!==j)return;if(e.status===429)toast('Jam: troppe azioni di fila, aspetta qualche secondo',3500);else if(j.fails===2)toast('Jam: la connessione è instabile',3000)}}
function jamConnect(since){const j=jam;if(!j)return;if(j.close)j.close();clearTimeout(j.rt);
  j.close=jamNet.sub(j.topic,since,d=>jamOnMsg(d,j),()=>{if(jam!==j)return;if(j.close)j.close();j.close=null;clearTimeout(j.rt);j.rt=setTimeout(()=>{if(jam===j)jamConnect(j.lastId||'1m')},2500)})}

/* --- host --- */
const jamMembers=()=>jam?Object.values(jam.peers).map(p=>p.n):[];
function jamState(){const t=S.byId.get(S.curId);const q=t?upcoming(6).map(id=>S.byId.get(id)).filter(Boolean).map(x=>({k:jamKey(x),n:x.name})):[];
  return{y:'st',k:t?jamKey(t):null,n:t?t.name:'',p:+(audio.currentTime||0).toFixed(2),pl:!!t&&!audio.paused,r:audio.playbackRate||1,q,m:jamMembers(),ctl:jam.ctl!==false}}
function jamPush(force){if(!jamIsHost())return;if(force)jam.force=true;clearTimeout(jam.pt);const j=jam;
  j.pt=setTimeout(()=>{if(jam!==j)return;const s=jamState();const sig=JSON.stringify([s.k,s.pl,s.q.map(x=>x.k),s.m,s.ctl,s.r]);
    if(!j.force&&sig===j.sig)return;j.force=false;j.sig=sig;jamSend(s,j)},j.force?80:400)}
function jamGo(id){const u=S.up.indexOf(id);if(u>=0){S.up.splice(u,1);load(id,true);return}
  const k=S.ctx.indexOf(id);if(k>=0){S.pos=k;load(id,true);return}S.up.unshift(id);next(false)}
function jamCmd(o){const who=o.who||'Qualcuno',ctl=jam.ctl!==false;
  if(o.a==='add'||(!ctl&&o.a==='play')){const t=jamFind(o.k,o.n);if(!t){toast(`${who} vorrebbe «${o.n}», ma non è nella tua libreria`,3500);return}
    if(o.next)S.up.unshift(t.id);else S.up.push(t.id);toast(`${who} ha aggiunto «${t.name}»`,2600);if(!S.curId)next(false);renderUpNext();setTimeout(preloadNext,300);jamPush(true);return}
  if(!ctl){jamPush(true);return}
  if(o.a==='play'){const t=jamFind(o.k,o.n);if(!t){toast(`${who} vorrebbe «${o.n}», ma non è nella tua libreria`,3500);jamPush(true);return}
    if(t.id!==S.curId){toast(`${who} ha messo «${t.name}»`,2200);jamGo(t.id)}jamPush(true)}
  else if(o.a==='pl'){if(o.v){if(!S.curId||!audio.src)toggle();else audio.play().catch(()=>{})}else audio.pause();jamPush(true)}
  else if(o.a==='seek'){let p=+o.p||0;if(o.pl)p+=Math.max(0,(Date.now()-o.ts)/1000);const d=audio.duration||0;try{audio.currentTime=d?Math.min(d-.1,p):p}catch(e){}jamPush(true)}}

/* --- ospite --- */
const jamTarget=s=>(s.p||0)+(s.pl?Math.max(0,(Date.now()-s.ts)/1000)*(s.r||1):0);
function jamSetTime(v){jam.ownSeek=Date.now();try{audio.currentTime=v}catch(e){}}
function jamOnHostTrack(){const t=S.byId.get(S.curId),s=jam&&jam.st;return!!(t&&s&&(jamKey(t)===s.k||normName(t.name)===normName(s.n)))}
function jamDrift(){if(!jamIsGuest()||!jam.st||jam.missing||Date.now()<(jam.hold||0)||!jamOnHostTrack()||audio.readyState<1)return;
  const s=jam.st,tg=jamTarget(s),d=audio.duration||0;if(d&&tg>d-.3)return;
  if(Math.abs((audio.currentTime||0)-tg)>(s.pl?.8:.3))jamSetTime(tg)}
function jamNeedTap(){if(!jam)return;jam.needTap=true;jamUI()}
async function jamApply(){if(!jamIsGuest()||!jam.st)return;const s=jam.st,j=jam;
  if(Date.now()-s.ts>10*60e3&&!j.live){jamUI();return}  // stato vecchio: aspetto che l'host risponda
  j.live=true;j.quiet=Date.now()+1500;
  const t=s.k?jamFind(s.k,s.n):null;
  if(!t){j.missing=s.k?s.n:null;if(!audio.paused)audio.pause();jamUI();return}
  j.missing=null;
  const q=(s.q||[]).map(x=>jamFind(x.k,x.n)).filter(x=>x&&x.id!==t.id).map(x=>x.id);
  S.ctx=[t.id,...q];S.ctxBase=[...S.ctx];S.pos=0;S.up=[];S.ctxLabel='Jam';
  if(audio.playbackRate!==(s.r||1))audio.playbackRate=s.r||1;
  if(S.curId!==t.id||!audio.src||audio.src===jamSilentUrl){j.applying=true;const p=load(t.id,s.pl);j.applying=false;await p;if(jam!==j)return;j.quiet=Date.now()+1500;
    if(s.pl&&audio.paused&&audio.readyState>=1)audio.play().catch(()=>jamNeedTap())}
  else{jamDrift();if(s.pl&&audio.paused)audio.play().catch(()=>jamNeedTap());else if(!s.pl&&!audio.paused)audio.pause()}
  renderUpNext();setTimeout(preloadNext,300);jamUI()}
function jamAsk(o){o.y='cmd';jam.hold=Date.now()+3000;jamSend(o)}
/* chiamato all'inizio di load(): se l'ospite sceglie un altro brano lo chiede all'host */
function jamHookLoad(id){if(!jamIsGuest()||jam.applying)return false;const t=S.byId.get(id);if(!t)return false;
  if(jam.st&&jamKey(t)===jam.st.k)return false;
  if(jam.st&&jam.st.ctl===false){jamAsk({a:'add',k:jamKey(t),n:t.name});toast(`«${t.name}» aggiunto alla coda della Jam`);setTimeout(jamApply,60);return true}
  jamAsk({a:'play',k:jamKey(t),n:t.name});return false}
function jamQueue(id,first){if(!jamIsGuest())return false;const t=S.byId.get(id);if(!t)return true;
  jamAsk({a:'add',k:jamKey(t),n:t.name,next:!!first});toast(`«${t.name}» aggiunto alla Jam`);return true}
function jamEnded(){const id=S.curId;setTimeout(()=>{if(jamIsGuest()&&S.curId===id&&audio.ended){jam.applying=true;next(true);jam.applying=false}},3000)}

async function jamOnMsg(d,j){if(jam!==j)return;j.lastId=d.id;jamSave();let o;try{o=await jamUnseal(d.message,j.key)}catch(e){return}
  if(jam!==j||!o||o.from===jamMe)return;const age=Date.now()-(o.ts||0);
  if(j.role==='host'){
    if(o.y==='hi'){const isNew=!j.peers[o.from];j.peers[o.from]={n:o.who||'Ospite',at:Date.now()};if(isNew&&age<120e3)toast(`${o.who||'Qualcuno'} è entrato nella Jam`,2600);jamUI();jamPush(true)}
    else if(o.y==='bye'){if(j.peers[o.from]){delete j.peers[o.from];if(age<120e3)toast(`${o.who||'Qualcuno'} è uscito dalla Jam`,2600);jamUI();jamPush(true)}}
    else if(o.y==='cmd'&&age<120e3){if(!j.peers[o.from]){j.peers[o.from]={n:o.who||'Ospite'};jamUI()}j.peers[o.from].at=Date.now();jamCmd(o)}}
  else{
    if(o.y==='st'){if(!j.st||o.ts>=j.st.ts){j.st=o;j.host=o.from;clearTimeout(j.at);j.at=setTimeout(jamApply,40)}
      if(o.ask&&age<120e3)setTimeout(()=>{if(jam===j)jamSend({y:'hi'},j)},300+Math.random()*1500)}
    else if(o.y==='end'&&(!j.host||o.from===j.host)&&age<6*3600e3){toast(`${o.who||'L\'host'} ha chiuso la Jam`,3500);jamStop(true)}}}

/* --- avvio, uscita --- */
let jamSilentUrl=null;
function jamUnlock(){/* sbloccare l'audio con un tocco: dopo, i brani della Jam possono partire da soli */
  try{if(audio.src&&audio.src!==jamSilentUrl)return;if(!jamSilentUrl){const n=800,b=new ArrayBuffer(44+n),v=new DataView(b);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
      w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n,true);
      jamSilentUrl=URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
    if(jam)jam.quiet=Date.now()+1500;audio.src=jamSilentUrl;
    audio.play().then(()=>{if(audio.src===jamSilentUrl){audio.pause();audio.removeAttribute('src');audio.load()}}).catch(()=>{})}catch(e){}}
async function jamBegin(code,role,resume){if(jam)jamStop(false);const k=await jamKeys(code);
  jam={code,role,topic:k.topic,key:k.key,peers:{},st:null,lastId:resume&&resume.lastId||null,ctl:role==='host'?SET.jamCtl!==false:true};
  jamSave();jamConnect(jam.lastId||(role==='guest'?'latest':null));jamUI();if(S.curId)updateNow();
  if(role==='host'){const s=jamState();s.ask=1;jam.sig=JSON.stringify([s.k,s.pl,s.q.map(x=>x.k),s.m,s.ctl,s.r]);jamSend(s)}else jamSend({y:'hi'})}
function jamStop(remote){if(!jam)return;const j=jam;if(!remote)jamSend({y:j.role==='host'?'end':'bye'},j);
  clearTimeout(j.rt);clearTimeout(j.pt);clearTimeout(j.at);setTimeout(()=>{if(j.close)j.close()},remote?0:1500);
  jam=null;ls.del('sp-jam');if(S.ctxLabel==='Jam')S.ctxLabel='';jamUI();if(S.curId)updateNow()}
function jamBoot(){const m=location.hash.match(/jam=([A-Za-z0-9]{6})/);
  if(m){history.replaceState(null,'',location.pathname+location.search);setTimeout(()=>jamSheet(m[1].toUpperCase()),600);return}
  try{const r=JSON.parse(ls.get('sp-jam')||'null');if(r&&r.code&&Date.now()-r.at<6*3600e3){jamBegin(r.code,r.role,r).then(()=>{if(r.role==='guest'&&audio.paused)jamNeedTap()})}}catch(e){}}

  <p class="note">Poi ognuno tocca qui sotto <b>Ricollega Dropbox</b> e accetta.</p>
  <div class="opts"><button class="opt" id="scRe">${ICON.cloud}<span class="lbl">Ricollega Dropbox</span></button></div>`,
  el=>{el.querySelector('#scRe').onclick=()=>{closeSheet();dbxConnect(false)}})}
let uploading=false;
async function dbxUpload(f,list){if(uploading){toast('Sto già caricando, aspetta un attimo');return}uploading=true;const ac=acctById(f.acct);
  const P=$('prog'),PT=$('progT'),PB=$('progBar');P.hidden=false;let ok=0,big=0,stop=null;
  try{for(let i=0;i<list.length;i++){const file=list[i];PT.textContent=`Carico su Dropbox ${i+1} di ${list.length}: ${file.name}`;PB.style.width=(5+90*i/list.length)+'%';
      if(file.size>150e6){big++;continue}
      try{await dbxFetch(ac,'https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{'Content-Type':'application/octet-stream','Dropbox-API-Arg':hdrArg({path:(f.path||'')+'/'+file.name,mode:'add',autorename:true,mute:false})},body:file});ok++}
      catch(e){const b=String(e.body||e.message||'');
        if(/missing_scope|files\.content\.write/.test(b)){stop='scope';break}
        if(/no_write_permission|insufficient_space|disallowed/.test(b)||e.status===403){stop=/insufficient_space/.test(b)?'space':'ro';break}
        if(e.message==='nolink'){stop='link';break}
        stop='net';break}}}
  finally{uploading=false;PB.style.width='100%';setTimeout(()=>{P.hidden=true},400)}
  if(ok)toast(ok===1?'1 brano caricato: arriva anche a chi condivide la cartella':`${ok} brani caricati: arrivano anche a chi condivide la cartella`,3500);
  if(stop==='scope')dbxScopeSheet();
  else if(stop==='ro')toast('Questa cartella è in sola lettura: chi l\'ha condivisa deve darti il permesso "Può modificare"',5000);
  else if(stop==='space')toast('Dropbox è pieno: libera spazio e riprova',4500);
  else if(stop==='link')toast('Ricollega Dropbox dalle impostazioni',3500);
  else if(stop==='net')toast('Caricamento interrotto: controlla la connessione e riprova',4000);
  if(big)toast(`${big} file troppo grandi (oltre 150 MB): esportali in AAC o MP3`,4500);
  if(ok)dbxSync(true)}
$('upIn').addEventListener('change',e=>{if(!$('sheet').hidden)closeSheet();const fl=[...(e.target.files||[])];e.target.value='';if(!fl.length){toast('Nessun file selezionato');return}dbxUploadPick(fl)});

/* scorri un brano verso destra per metterlo in coda (come su Spotify) */
(()=>{const L=$('list');let st=null;
  const QI='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h12M4 12h12M4 18h7"/><path d="M18 14v6M15 17h6"/></svg>';
  const reset=r=>{r.classList.remove('swiping');r.style.setProperty('--sx','0px')};
  L.addEventListener('touchstart',e=>{const r=e.target.closest('.row');if(!r||e.target.closest('[data-more]')){st=null;return}const t=e.touches[0];st={r,x:t.clientX,y:t.clientY,dir:null,dx:0,arm:false,bg:null}},{passive:true});
  L.addEventListener('touchmove',e=>{if(!st)return;const t=e.touches[0],dx=t.clientX-st.x,dy=t.clientY-st.y;
    if(!st.dir&&(Math.abs(dx)>10||Math.abs(dy)>10))st.dir=Math.abs(dx)>Math.abs(dy)*1.3&&dx>0?'h':'v';
    if(st.dir!=='h')return;
    if(!st.bg){st.bg=document.createElement('div');st.bg.className='qbg';st.bg.innerHTML=QI;st.r.prepend(st.bg);st.r.classList.add('swiping')}
    const TH=Math.min(110,st.r.clientWidth*.3),x=Math.max(0,dx),vis=x<TH?x:TH+(x-TH)*.35;st.dx=x;
    st.r.style.setProperty('--sx',vis+'px');st.bg.style.width=Math.max(0,vis-6)+'px';st.bg.style.opacity=String(Math.min(1,x/(TH*.6)));
    const arm=x>=TH;if(arm!==st.arm){st.arm=arm;st.bg.classList.toggle('arm',arm);if(arm)try{navigator.vibrate&&navigator.vibrate(8)}catch(z){}}},{passive:true});
  const end=()=>{if(!st)return;const s0=st;st=null;if(s0.dir!=='h'){return}
    s0.r.dataset.swiped='1';setTimeout(()=>{delete s0.r.dataset.swiped},400);reset(s0.r);
    if(s0.arm){const id=s0.r.dataset.id,t=S.byId.get(id);
      if(!jamQueue(id,false)){S.up.push(id);if(!S.curId)next(false);renderUpNext();setTimeout(preloadNext,300);toast(t?'In coda: '+t.name:'Aggiunto in coda',1800)}
      if(s0.bg)s0.bg.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>'}
    if(s0.bg){const bg=s0.bg;bg.classList.add('back');requestAnimationFrame(()=>{bg.style.width='0px';bg.style.opacity='0'})}
    const bg=s0.bg;setTimeout(()=>bg&&bg.remove(),800)};
  L.addEventListener('touchend',end);L.addEventListener('touchcancel',end);
  L.addEventListener('click',e=>{const r=e.target.closest('.row');if(r&&r.dataset.swiped){e.stopPropagation();e.preventDefault()}},true)})();

/* ================= app da installare (computer, Android) ================= */
let instEvt=null;
const isApp=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEvt=e;if(!isApp()&&!ls.get('sp-inst-no'))setTimeout(installBar,1800)});
window.addEventListener('appinstalled',()=>{instEvt=null;const b=$('instBar');if(b)b.remove();toast('Studio Player installato: lo trovi tra le tue app',3500)});
async function doInstall(){const b=$('instBar');if(b)b.remove();
  if(!instEvt){toast(IOS?'Su iPhone: tocca Condividi › Aggiungi alla schermata Home':'Nel menu del browser (⋮) scegli "Installa Studio Player" o l\'icona di installazione nella barra degli indirizzi',5000);return}
  const e=instEvt;instEvt=null;try{e.prompt();const r=await e.userChoice;if(r&&r.outcome==='dismissed')instEvt=null}catch(x){}}
function installBar(){if(!instEvt||$('instBar')||isApp())return;const d=document.createElement('div');d.id='instBar';d.className='instbar';
  d.innerHTML=`<img src="icon-192.png" alt=""><div class="txt"><b>Installa Studio Player</b><span>Si apre come un'app, con la sua icona</span></div><button class="btn" id="instGo">Installa</button><button class="ib" id="instNo" aria-label="Non ora">${ICON.x}</button>`;
  document.body.appendChild(d);d.querySelector('#instGo').onclick=doInstall;d.querySelector('#instNo').onclick=()=>{ls.set('sp-inst-no','1');d.remove()}}

/* ================= avvio ================= */
(async()=>{if(new URLSearchParams(location.search).has('u'))history.replaceState(null,'',REDIR);
  applySettings();syncModes();syncPlay();updTimer();setTimeout(()=>checkUpdate(false),1500);
  const metas=await idb.all('tracks');
  try{const keys=await idb.keys('meta');for(const k of keys)if(String(k).startsWith('cover:'))S.covers[String(k).slice(6)]=await idb.get('meta',k)}catch(e){}
  S.tracks=metas.length?metas:DEMOS.map(d=>({...d}));S.byId=new Map(S.tracks.map(t=>[t.id,t]));render();
  try{const r=JSON.parse(ls.get('sp-resume')||'null');if(r&&S.byId.has(r.id)){S.ctx=(r.ctx||[]).filter(id=>S.byId.has(id));if(!S.ctx.includes(r.id))S.ctx=[r.id];S.ctxBase=[...S.ctx];S.pos=S.ctx.indexOf(r.id);S.ctxLabel=r.label||'';
    S.curId=r.id;lastPos=r.t||0;$('mini').hidden=false;updateNow();render();
    const t=S.byId.get(r.id),d=t.duration||0;$('miniProg').style.width=(d?lastPos/d*100:0)+'%';$('cur').textContent=fmt(lastPos);$('rem').textContent='-'+fmt(d-lastPos)}}catch(e){}
  /* ora Dropbox vince sui doppioni: i brani Dropbox nascosti come doppioni di Drive tornano visibili (una volta sola) */
  if(SET.uiV!==3){SET.uiV=3;SET.coverStyle='classica';SET.tech=false;saveSet();applySettings();render()}
  if(SET.dedupeV!==2){SET.dedupeV=2;saveSet();const h=hiddenIds();if(h.some(x=>String(x).startsWith('dbx:')))ls.set('sp-hidden',JSON.stringify(h.filter(x=>!String(x).startsWith('dbx:'))))}
  jamBoot();
  await gdBoot();
  await dbxBoot();
})();
