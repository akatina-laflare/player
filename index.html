<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0c0f" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Studio Player</title>
<style>
/* Layout: libreria con titolo grande e schede (Brani / Cartelle / Preferiti), mini player fisso in basso,
   schermata di ascolto a foglio con forma d'onda, fogli d'azione dal basso per menu, coda e impostazioni */
:root{
  --bg:#f5f4f7; --surface:#ffffff; --raised:#ffffff; --fg:#151318; --muted:#706b78; --line:rgba(21,19,24,.09);
  --accent:#e2465f; --glass:rgba(248,247,250,.84); --chip:rgba(21,19,24,.06); --scrim:rgba(10,8,12,.38);
  --np-bg:#ffffff; --np-fg:#151318; --np-muted:#7a7582; --np-track:rgba(21,19,24,.16); --np-chip:rgba(21,19,24,.06);
  --danger:#d93636;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0c0f; --surface:#17151a; --raised:#35313a; --fg:#f4f2f6; --muted:#9b96a3; --line:rgba(255,255,255,.08);
  --glass:rgba(23,21,26,.84); --chip:rgba(255,255,255,.08); --scrim:rgba(0,0,0,.55); --danger:#ff6b6b;
  --np-bg:#000000; --np-fg:#f4f2f6; --np-muted:#9b96a3; --np-track:rgba(255,255,255,.18); --np-chip:rgba(255,255,255,.09); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0c0f; --surface:#17151a; --raised:#35313a; --fg:#f4f2f6; --muted:#9b96a3; --line:rgba(255,255,255,.08);
  --glass:rgba(23,21,26,.84); --chip:rgba(255,255,255,.08); --scrim:rgba(0,0,0,.55); --danger:#ff6b6b;
  --np-bg:#000000; --np-fg:#f4f2f6; --np-muted:#9b96a3; --np-track:rgba(255,255,255,.18); --np-chip:rgba(255,255,255,.09); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg{display:block;flex:none}

.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:6px 130px}
.top{display:flex;flex-direction:column;gap:2px;padding-block:14px 8px}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-size:16px;padding:4px 0;align-self:flex-start}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-size:32px;font-weight:700;letter-spacing:-.02em;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-btns{display:flex;gap:4px}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:50%}
.ib:active{background:var(--chip)}
.acc{color:var(--accent)}

.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:10px;padding:2px;margin:6px 0 12px}
.seg button{padding:7px 4px;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--raised);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:11px;padding:9px 11px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:inherit;font-size:16px;outline:none}
.sortb{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:11px;padding:9px 11px;color:var(--fg);font-size:14px;white-space:nowrap}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 4px}
.pill{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--chip);color:var(--accent);font-weight:600;border-radius:12px;padding:12px}
.pill:active{opacity:.7}

.fhead{display:flex;gap:16px;align-items:flex-end;margin:4px 0 6px}
.fhead .art{width:132px;height:132px;border-radius:12px;flex:none;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.fhead .info{min-width:0;display:flex;flex-direction:column;gap:4px}
.fhead .path{font-size:13px;color:var(--muted);overflow-wrap:anywhere}

.list{list-style:none;margin:6px 0 0;padding:0}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:7px 0;cursor:pointer;border-radius:8px}
.row:active{background:var(--chip)}
.art{position:relative;overflow:hidden;display:grid;place-items:center;background-size:cover;background-position:center}
.row .art{width:50px;height:50px;border-radius:7px;flex:none}
.row .meta{flex:1;min-width:0;border-bottom:1px solid var(--line);align-self:stretch;display:flex;align-items:center;gap:6px;padding-block:4px}
.row:last-child .meta{border-bottom-color:transparent}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.row.playing .t{color:var(--accent);font-weight:600}
.heart{color:var(--accent)}
.more{width:36px;height:40px;display:grid;place-items:center;color:var(--muted);border-radius:8px}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin-right:6px;vertical-align:1px}
.tag.ll{color:var(--accent);border-color:currentColor}
.bars{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:14px;background:rgba(0,0,0,.4)}
.bars i{width:4px;background:#fff;border-radius:2px;height:8px;animation:eq .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:-.3s}.bars i:nth-child(3){animation-delay:-.6s}
.paused .bars i{animation-play-state:paused}
@keyframes eq{0%,100%{height:6px}50%{height:22px}}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes artIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes miniIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes toastIn{from{transform:translate(-50%,12px)}to{transform:translate(-50%,0)}}
.list.anim .row{animation:rowIn .32s cubic-bezier(.2,.8,.2,1) both}
.grid.anim .card{animation:rowIn .36s cubic-bezier(.2,.8,.2,1) both}
.pop{animation:pop .38s cubic-bezier(.3,1.6,.5,1)}
.big.swap{animation:artIn .42s cubic-bezier(.2,.8,.2,1)}
.mini.enter{animation:miniIn .35s cubic-bezier(.2,.8,.2,1)}
.toast.show{animation:toastIn .25s ease-out}
.ib,.pill,.chip,.card,.btn,.sw{transition:transform .15s ease}
.ib:active,.pill:active,.chip:active,.btn:active{transform:scale(.9)}
.ctrl .play:active{transform:scale(.86)}
.row .art{transition:transform .2s ease}
.row:active .art{transform:scale(.94)}
.cover-note{width:42%;height:42%;color:rgba(255,255,255,.6)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px;margin-top:8px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.card .art{width:100%;aspect-ratio:1;max-width:100%;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.card .t{font-size:15px;font-weight:500}
.card:active .art{transform:scale(.97)}

.dupbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--chip);border-radius:14px;padding:10px 10px 10px 14px;margin:10px 0 4px}
.dupbar span{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px}
.dupbar svg{color:var(--danger);flex:none}
.dupbar .btn{padding:9px 14px;font-size:14px;background:var(--danger)}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:22px 18px;margin:14px 0;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty h2{margin:0;font-family:var(--display);font-size:20px;letter-spacing:-.01em}
.empty p{margin:0;color:var(--muted);line-height:1.45;max-width:52ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;font-weight:600;border-radius:12px;padding:12px 16px}
.btn.ghost{background:var(--chip);color:var(--accent)}
.btn:active{opacity:.8}
.none{color:var(--muted);text-align:center;padding:28px 10px}

/* mini player */
.mini{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border-top:1px solid var(--line);z-index:5}
.mini-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:6px}
.mini .open{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.mini .art{width:44px;height:44px;border-radius:7px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.mini .txt{min-width:0}
.mini .t{font-size:15px;font-weight:500}
.mini-prog{position:absolute;left:0;top:-1px;height:2px;background:var(--accent);width:0}

/* schermata di ascolto */
.np{position:fixed;inset:0;z-index:10;color:var(--np-fg);background:var(--np-bg);transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);overflow:hidden;visibility:hidden}
.np.open{transform:none;visibility:visible}
.np.drag{transition:none}
.np-bg{display:none;position:absolute;inset:-20%;filter:blur(60px) saturate(1.2);transform:scale(1.2);background-size:cover;background-position:center}
.np-bg::after{content:"";position:absolute;inset:0;background:rgba(10,8,12,.5)}
.np-in{position:relative;height:100%;overflow-y:auto;overscroll-behavior:contain;max-width:480px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top,0px)) 22px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.np-in>*{flex:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--np-track);margin:4px auto 0;flex:none}
.np-head{display:flex;justify-content:space-between;align-items:center}
.np .ib{color:var(--np-fg)}
.np .ib:active{background:var(--np-chip)}
.np-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--np-muted);font-weight:600;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{width:100%;max-width:340px;aspect-ratio:1;margin:4px auto 0;border-radius:14px;box-shadow:0 24px 50px rgba(0,0,0,.42);transition:transform .35s ease}
.np.paused .big{transform:scale(.88)}
.big{box-shadow:0 18px 40px rgba(0,0,0,.22)}
.np-title{display:flex;align-items:center;gap:6px}
.np-title .txt{flex:1;min-width:0}
.np-title .t{font-size:21px;font-weight:700}
.np-title .s{color:var(--np-muted);font-size:16px}
.scrub{position:relative;padding-block:14px;margin-block:-14px;touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none}
.pbar{position:relative;height:7px;border-radius:4px;background:var(--np-track);overflow:hidden;pointer-events:none;transition:height .18s ease,margin .18s ease}
.scrub.active .pbar{height:13px;margin-block:-3px}
.pfill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--np-fg);opacity:.85}
.scrub.active .pfill{opacity:1}
.pab{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.35}
.bubble{position:absolute;bottom:calc(100% - 4px);transform:translateX(-50%);background:var(--np-fg);color:var(--np-bg);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.2);white-space:nowrap}
.bubble b{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums}
.bubble span{font-size:11px;opacity:.7}
.bubble span:empty{display:none}
.times{display:flex;justify-content:space-between;font-size:12px;font-weight:500;color:var(--np-muted);font-variant-numeric:tabular-nums;margin-top:8px}
.scrub.active+.times{color:var(--np-fg)}
.ctrl{display:flex;justify-content:space-around;align-items:center}
.ctrl .ib{width:64px;height:64px}
.ctrl .play{width:82px;height:82px}
.vol{display:flex;align-items:center;gap:10px;color:var(--np-muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:none;margin:0;--p:100%}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(var(--np-muted),var(--np-muted)) 0/var(--p) 100% no-repeat,var(--np-track)}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--np-track)}
input[type=range]::-moz-range-progress{height:5px;border-radius:3px;background:var(--np-muted)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--np-fg);margin-top:-4.5px}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--np-fg)}
.chips{display:flex;justify-content:space-around;align-items:center}
.chip{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;min-width:48px;height:44px;padding:0 10px;border-radius:22px;color:var(--np-muted);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.chip svg{width:22px;height:22px}
.chip.on{color:var(--accent);background:var(--np-chip)}
#repL,#speedBtn,#abBtn{display:none}
#rep.one::after{content:"1";position:absolute;top:6px;right:8px;font-size:9px;font-weight:800;color:var(--accent)}
#timerL:not(:empty){margin-left:2px}
#npFav[aria-pressed="true"]{color:var(--accent)}
.card-np{background:var(--np-chip);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--np-muted);font-family:var(--mono)}
.kv b{color:var(--np-fg);font-weight:600}
.notes textarea{width:100%;min-height:96px;resize:vertical;border:0;border-radius:10px;padding:10px;background:var(--np-chip);color:var(--np-fg);font:inherit;font-size:15px;line-height:1.45}
.notes textarea::placeholder{color:var(--np-muted)}

/* fogli dal basso */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);color:var(--fg);border-radius:16px 16px 0 0;max-height:86%;overflow-y:auto;overscroll-behavior:contain;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:6px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.show{transform:none}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet .grab{background:var(--line)}
.sh-head{display:flex;align-items:center;gap:12px}
.sh-head .art{width:52px;height:52px;border-radius:8px;flex:none}
.sh-head .txt{min-width:0;flex:1}
.sh-title{font-family:var(--display);font-size:20px;font-weight:700;margin:0}
.opts{display:flex;flex-direction:column;background:var(--chip);border-radius:12px;overflow:hidden}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:16px}
.opt:last-child{border-bottom:0}
.opt:active{background:var(--line)}
.opt .lbl{flex:1;min-width:0}
.opt .hint{color:var(--muted);font-size:14px}
.opt.danger{color:var(--danger)}
.opt>svg,.opt>.acc>svg{color:var(--accent);flex:none}
.opt.danger>svg{color:var(--danger)}
.opt.sel{color:var(--accent);font-weight:600}
.sec{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:4px 2px -6px}
.note{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.swatches{display:flex;gap:12px;flex-wrap:wrap;padding:4px 2px}
.sw{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.sw[aria-pressed="true"]{outline:3px solid var(--fg);outline-offset:2px}
.segs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--chip);border-radius:10px;padding:2px}
.segs button{padding:8px 4px;border-radius:8px;font-size:14px;color:var(--muted)}
.segs button[aria-pressed="true"]{background:var(--raised);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{width:100%;font:inherit;font-size:17px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.toggle{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.toggle[aria-checked="true"]{background:var(--accent)}
.toggle[aria-checked="true"]::after{transform:translateX(20px)}
.q-now{color:var(--accent)}
.x{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--muted);flex:none}

.prog{position:fixed;left:16px;right:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;background:var(--raised);color:var(--fg);border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:25;display:flex;flex-direction:column;gap:8px}
.prog .bar{height:5px;border-radius:3px;background:var(--chip);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.vh{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;overflow:hidden}
.pick{position:relative;overflow:hidden}
.pick>input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px}
.card.add .art{background:var(--chip);box-shadow:none;border:1.5px dashed var(--line);color:var(--accent)}
.card.add .t{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
.drop{position:fixed;inset:12px;border:3px dashed var(--accent);border-radius:20px;background:var(--glass);z-index:50;display:grid;place-items:center;font-size:20px;font-weight:600;color:var(--accent);pointer-events:none}
@media (min-width:700px){.fhead .art{width:180px;height:180px}}
@media (prefers-reduced-motion: reduce){.list.anim .row,.grid.anim .card,.pop,.big.swap,.mini.enter,.toast.show{animation:none}.np,.big,.sheet,.scrim{transition:none}.bars i{animation:none;height:12px}}
</style>

<div class="wrap">
  <header class="top">
    <button class="back" id="back" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Cartelle</button>
    <div class="top-row">
      <h1 id="h1">Libreria</h1>

<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const ICON={
  play:z=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"/></svg>`,
  pause:z=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>`,
  heart:(z,f)=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>`,
  more:`<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>`,
  note:`<svg class="cover-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="18" cy="16" r="3" fill="currentColor"/></svg>`,
  cloud:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h10.5a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.6 9.7 4.4 4.4 0 0 0 7 18.5z"/></svg>`,
  folder:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v8.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>`,
  file:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`,
  playNext:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M4 11h10M4 16h6"/><path d="M16 13v7l5-3.5z" fill="currentColor"/></svg>`,
  queueAdd:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h12M4 11h12M4 16h7M18 14v6M15 17h6"/></svg>`,
  pencil:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>`,
  image:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>`,
  undo:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>`,
  share:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>`,
  trash:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>`,
  dl:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 20h14"/></svg>`,
  goFolder:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v8.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>`,
  down:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v8M8.5 12.5 12 16l3.5-3.5"/></svg>`,
  x:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>`
};

/* ================= impostazioni ================= */
const ACCENTS={rosso:'#e2465f',ambra:'#d98a2b',blu:'#3d7be0',verde:'#2f9e6b',viola:'#8a5cd6',grafite:'#6f6a78'};
const SORTS={added:'Recenti',title:'Titolo',folder:'Cartella',duration:'Durata',plays:'Più ascoltati'};
const SET=Object.assign({theme:'auto',accent:'rosso',coverStyle:'tinta',tech:true,sort:'added',crossKeep:true},(()=>{try{return JSON.parse(ls.get('sp-settings')||'{}')}catch(e){return{}}})());
const saveSet=()=>ls.set('sp-settings',JSON.stringify(SET));
const hostTheme=document.documentElement.getAttribute('data-theme');
function applySettings(){
  const r=document.documentElement;
  if(SET.theme==='auto'){if(hostTheme)r.setAttribute('data-theme',hostTheme);else r.removeAttribute('data-theme')}else r.setAttribute('data-theme',SET.theme);
  r.style.setProperty('--accent',ACCENTS[SET.accent]||ACCENTS.rosso);
  $('techCard').hidden=!SET.tech;
}

/* ================= stato ================= */
const S={tracks:[],byId:new Map(),covers:{},tab:'songs',folder:null,query:'',
  ctx:[],pos:-1,up:[],curId:null,ctxLabel:'',shuffle:false,repeat:'off',speed:1,sleepEnd:0,sleepTrack:false,A:null,B:null,visible:[]};
try{const m=JSON.parse(ls.get('sp-modes')||'{}');S.shuffle=!!m.shuffle;S.repeat=['off','all','one'].includes(m.repeat)?m.repeat:'off';S.speed=+m.speed||1}catch(e){}
const audio=new Audio();audio.preload='auto';
try{audio.preservesPitch=true;audio.mozPreservesPitch=true;audio.webkitPreservesPitch=true}catch(e){}
const urls={};

/* ================= archivio (IndexedDB): metadati, file audio e copertine separati ================= */
let dbp=null;
function db(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('studio-player',3);
  r.onupgradeneeded=()=>{const d=r.result;for(const n of [...d.objectStoreNames])d.deleteObjectStore(n);d.createObjectStore('tracks',{keyPath:'id'});d.createObjectStore('blobs');d.createObjectStore('meta')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))}catch(e){rej(e)}});dbp.catch(()=>{});return dbp}
function tx(store,mode,fn){return db().then(d=>new Promise((res,rej)=>{const t=d.transaction(store,mode);const s=t.objectStore(store);let out;const r=fn(s);if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('abort'))}))}
const idb={
  all:s=>tx(s,'readonly',st=>st.getAll()).catch(()=>[]),
  keys:s=>tx(s,'readonly',st=>st.getAllKeys()).catch(()=>[]),
  get:(s,k)=>tx(s,'readonly',st=>st.get(k)).catch(()=>undefined),
  put:(s,v,k)=>tx(s,'readwrite',st=>k===undefined?st.put(v):st.put(v,k)).then(()=>true,()=>false),
  del:(s,k)=>tx(s,'readwrite',st=>st.delete(k)).then(()=>true,()=>false),
  clear:s=>tx(s,'readwrite',st=>st.clear()).then(()=>true,()=>false)
};
const metaOf=t=>{const o={};for(const k in t)if(k!=='blob'&&k!=='demo')o[k]=t[k];return o};
const saveTrack=t=>t.demo?Promise.resolve(true):idb.put('tracks',metaOf(t));

/* ================= utilità ================= */
const fmt=s=>{if(!isFinite(s)||s<0)s=0;s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`};
const fmtLong=s=>{if(s<60)return Math.round(s)+' s';s=Math.round(s/60);if(s<60)return s+' min';return Math.floor(s/60)+' h '+(s%60)+' min'};
const fmtSize=b=>b>=1073741824?(b/1073741824).toFixed(2).replace('.',',')+' GB':b>=1048576?(b/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(b/1024))+' KB';
const extOf=n=>((n||'').match(/\.([a-z0-9]+)$/i)||[,''])[1].toLowerCase();
const AUDIO_EXT=['wav','wave','aif','aiff','aifc','mp3','m4a','aac','caf','flac','ogg','opus','alac'];
const IMG_EXT=['jpg','jpeg','png','webp','heic','gif'];
const isAudio=f=>AUDIO_EXT.includes(extOf(f.name))||(f.type||'').startsWith('audio/');
const isImg=f=>IMG_EXT.includes(extOf(f.name))||(f.type||'').startsWith('image/');
const MIME={wav:'audio/wav',wave:'audio/wav',aif:'audio/aiff',aiff:'audio/aiff',aifc:'audio/aiff',mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',caf:'audio/x-caf',flac:'audio/flac',ogg:'audio/ogg',opus:'audio/ogg',alac:'audio/mp4'};
const clean=n=>n.replace(/\.[^.]+$/,'').replace(/_/g,' ').replace(/\s+/g,' ').trim()||n;
const dirOf=p=>{const a=(p||'').split('/');a.pop();return a.join('/')};
const lastSeg=p=>(p||'').split('/').filter(Boolean).pop()||p;
const uid=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(m,ms=2400){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),ms)}
function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}

/* ================= copertine ================= */
function palette(seed){if(SET.coverStyle==='grafite')return['hsl(260 6% 52%)','hsl(260 6% 36%)','hsl(260 6% 20%)'];const a=hash(seed)%360;return[`hsl(${a} 28% 50%)`,`hsl(${a} 24% 36%)`,`hsl(${a} 20% 22%)`]}
const gradient=seed=>{const[p,q,r]=palette(seed);return`radial-gradient(circle at 25% 20%,${p},transparent 60%),radial-gradient(circle at 85% 80%,${q},transparent 65%),${r}`};
const coverOf=t=>t?(t.cover||S.covers[t.folder]||null):null;
function paintArt(el,t,seed){const c=coverOf(t);if(c){el.style.background=`url("${c}") center/cover`;el.innerHTML=''}else{el.style.background=gradient(seed||t&&(t.name)||'');el.innerHTML=ICON.note}}
function paintFolderArt(el,f){const c=S.covers[f]||(S.tracks.find(t=>t.folder===f&&t.cover)||{}).cover;if(c){el.style.background=`url("${c}") center/cover`;el.innerHTML=''}else{el.style.background=gradient(f);el.innerHTML=ICON.note}}
function artPNG(t){const c=coverOf(t);if(c)return c;try{const cv=document.createElement('canvas');cv.width=cv.height=512;const x=cv.getContext('2d');const[p,q,r]=palette(t.name);
  x.fillStyle=r;x.fillRect(0,0,512,512);let g=x.createRadialGradient(128,100,0,128,100,330);g.addColorStop(0,p);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,512,512);

  if(warming||!dbx.refresh)return;warming=true;
  (async()=>{try{while(warmQ.length){const id=warmQ.shift();const t=S.byId.get(id);if(!t)continue;
      try{const r=await dbxApi('files/get_temporary_link',{path:t.dbxId});tempLinks[id]={url:r.link,exp:Date.now()+3.5*3600e3};saveLinks()}catch(e){break}}}
    finally{warming=false}})()}

  if(t.src==='dbx'&&!t.offline){warmLinks([id]);setTimeout(()=>{const c=tempLinks[id];if(c&&preAudio.src!==c.url){preAudio.src=c.url;try{preAudio.load()}catch(e){}}},1500)}}

    if(!off){const c=tempLinks[t.id];if(c&&c.exp>Date.now())return c.url;
      try{const r=await dbxApi('files/get_temporary_link',{path:t.dbxId});tempLinks[t.id]={url:r.link,exp:Date.now()+3.5*3600e3};saveLinks();return r.link}
      catch(e){toast(navigator.onLine===false?'Serve internet per questo brano. Dal menu ··· puoi scaricarlo sul telefono':'Dropbox non risponde: riprova tra poco',4200);return'__fail'}}}
  if(urls[t.id]){if(!shareBlobs[t.id])blobFor(t).then(b=>{if(b)shareBlobs[t.id]=b});return urls[t.id]}const b=await blobFor(t);if(!b)return null;for(const k in shareBlobs)if(k!==t.id)delete shareBlobs[k];shareBlobs[t.id]=b;
  const ks=Object.keys(urls);if(ks.length>4)for(const k of ks.slice(0,ks.length-4))if(k!==S.curId){URL.revokeObjectURL(urls[k]);delete urls[k]}

let loadToken=0;
async function load(id,autoplay,at=0){const t=S.byId.get(id);if(!t)return;const my=++loadToken;const changed=S.curId!==id;S.curId=id;S.A=S.B=null;updateAB();
  const mini=$('mini');if(mini.hidden){mini.hidden=false;mini.classList.remove('enter');void mini.offsetWidth;mini.classList.add('enter')}
  updateNow();render();if(changed){const b=$('bigArt');b.classList.remove('swap');void b.offsetWidth;b.classList.add('swap')}
  const src=await srcFor(t);if(my!==loadToken)return;
  if(src==='__fail')return;
  if(audio.src===src&&autoplay){audio.play().catch(()=>{});return}
  if(!src){toast('Questo brano non è più salvato sul dispositivo: aggiungilo di nuovo');return}
  audio.src=src;audio.playbackRate=S.speed;setTimeout(preloadNext,2500);if(at)audio.addEventListener('loadedmetadata',()=>{try{audio.currentTime=at}catch(e){}},{once:true});

    if(b){const w=/^wav/.test(extOf(t.file))?await parseWav(b):null;p=w?await wavPeaks(b,w):await decodePeaks(b)}
    else if(isCloud(t)&&/^wav/.test(extOf(t.file))&&!t.duration){const rb=remoteBlob(t);const w=await parseWav(rb);if(w){t.duration=w.duration;saveTrack(t)}}

function playError(t){const i=t.info||{};toast(i.float&&i.bits===64?'Questo WAV è a 64-bit float: riesportalo da Logic a 24-bit':`Non riesco a riprodurre "${t.name}". Prova a riesportarlo da Logic in WAV 24-bit o AAC`,4500)}

    if(at)audio.addEventListener('loadedmetadata',()=>{try{audio.currentTime=at}catch(e){}},{once:true});

const wv=$('wave'),zone=$('scrubZone');
/* trascinamento relativo: il punto parte da dove tocchi, poi segue il dito.
   Se allontani il dito in verticale, lo scorrimento rallenta (metà, poi un quarto) per la precisione. */
let sd=null;
function wfrac(e){const r=wv.getBoundingClientRect();return Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))}
function showBubble(){const b=$('bubble'),r=wv.getBoundingClientRect(),d=audio.duration||(S.byId.get(S.curId)||{}).duration||0;
  b.hidden=true;$('scrubHint').textContent=sd&&sd.speed<1?(sd.speed===.5?'Scorrimento lento':'Scorrimento fine'):'';$('bubT').textContent=fmt((scrub||0)*d);$('bubS').textContent=sd&&sd.speed<1?(sd.speed===.5?'Scorrimento lento':'Scorrimento fine'):'';
  const x=Math.min(r.width-40,Math.max(40,(scrub||0)*r.width));b.style.left=x+'px'}
zone.addEventListener('pointerdown',e=>{if(!S.curId)return;e.preventDefault();try{zone.setPointerCapture(e.pointerId)}catch(x){}
  scrub=wfrac(e);sd={x:e.clientX,y:e.clientY,f:scrub,speed:1,w:wv.getBoundingClientRect().width};zone.classList.add('active');progress();showBubble()});
zone.addEventListener('pointermove',e=>{if(scrub==null||!sd)return;const dy=Math.abs(e.clientY-sd.y);const sp=dy>140?.25:dy>70?.5:1;
  if(sp!==sd.speed){sd.f=scrub;sd.x=e.clientX;sd.speed=sp}
  scrub=Math.min(1,Math.max(0,sd.f+(e.clientX-sd.x)/sd.w*sp));progress();showBubble()});

/* ================= doppioni ================= */
const normName=n=>String(n||'').toLowerCase().normalize('NFC').replace(/\.[a-z0-9]+$/,'').replace(/[_\s]+/g,' ').replace(/\s*(\(\d+\)|copia|copy)$/,'').trim();
const srcRank=t=>t.src==='gd'?3:t.src==='dbx'?2:1;
function findDupes(){const groups=new Map();
  for(const t of S.tracks){if(t.demo)continue;const k=normName(t.file||t.name)+'|'+lastSeg(t.folder||'').toLowerCase();if(!groups.has(k))groups.set(k,[]);groups.get(k).push(t)}
  const out=[];for(const g of groups.values())if(g.length>1){g.sort((a,b)=>srcRank(b)-srcRank(a)||(b.offline?1:0)-(a.offline?1:0));const keep=g[0];
    const drop=g.slice(1).filter(o=>o.src!==keep.src||o.size===keep.size);if(drop.length)out.push({keep,drop})}
  /* stesso nome in cartelle con nome diverso tra servizi diversi: confronta per nome e dimensione */
  const seen=new Set(out.flatMap(d=>[d.keep.id,...d.drop.map(x=>x.id)]));const bySize=new Map();
  for(const t of S.tracks){if(t.demo||seen.has(t.id))continue;const k=normName(t.file||t.name)+'|'+(t.size||0);if(!bySize.has(k))bySize.set(k,[]);bySize.get(k).push(t)}
  for(const g of bySize.values())if(g.length>1){g.sort((a,b)=>srcRank(b)-srcRank(a));out.push({keep:g[0],drop:g.slice(1)})}
  return out}
const dupeCount=()=>findDupes().reduce((a,d)=>a+d.drop.length,0);
async function dedupe(quiet){const ds=findDupes();if(!ds.length){if(!quiet)toast('Nessun doppione');return 0}
  const h=new Set(hiddenIds());let n=0;const ids=[];
  for(const{keep,drop}of ds){for(const d of drop){if(d.fav)keep.fav=true;keep.plays=(keep.plays||0)+(d.plays||0);if(!keep.cover&&d.cover)keep.cover=d.cover;
      const nt=ls.get('sp-notes:'+d.id);if(nt&&!ls.get('sp-notes:'+keep.id))ls.set('sp-notes:'+keep.id,nt);
      if(d.id===S.curId){S.curId=null;audio.pause();$('mini').hidden=true}
      if(isCloud(d))h.add(d.id);ids.push(d.id);n++}
    await saveTrack(keep)}
  ls.set('sp-hidden',JSON.stringify([...h]));await removeTracks(ids,true);
  if(!quiet)toast(n===1?'1 doppione rimosso':`${n} doppioni rimossi`);return n}

const gdUrl=t=>`${GD}files/${encodeURIComponent(t.gdId)}?alt=media&key=${GD_KEY}`;
async function gdApi(path,params){const u=new URL(GD+path);Object.entries({...params,key:GD_KEY,supportsAllDrives:'true'}).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u);if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}throw Object.assign(new Error('gd '+r.status+' '+m),{status:r.status})}return r.json()}
async function gdRange(t,a,b){const r=await fetch(gdUrl(t),{headers:{Range:`bytes=${a}-${b}`}});if(!r.ok&&r.status!==206)throw new Error('gd '+r.status);return r.arrayBuffer()}

async function gdUse(id,quiet){if(!GD_KEY){toast('Google Drive non è ancora configurato');return false}

    SET.gdRoot={id:f.id,name:f.name};saveSet();if(!quiet)toast('Cartella collegata: '+f.name);gdSync(true);return true}

    try{if(navigator.share){await navigator.share({title:'Studio Player',text:'Ascolta i nostri pezzi',url:link});return}}catch(e){if(e&&e.name==='AbortError')return}

async function gdBoot(){const q=new URLSearchParams(location.search);const id=q.get('gd');
  if(id){history.replaceState(null,'',REDIR);if(!SET.gdRoot||SET.gdRoot.id!==id){if(SET.gdRoot)await removeTracks(S.tracks.filter(t=>t.src==='gd').map(t=>t.id),true);await gdUse(id);return}}
  if(SET.gdRoot)gdSync(false)}
let gdSyncing=false;
async function gdSync(manual){if(!GD_KEY||!SET.gdRoot||gdSyncing)return;gdSyncing=true;
  const P=$('prog'),PT=$('progT'),PB=$('progBar');if(manual){P.hidden=false;PT.textContent='Controllo Google Drive…';PB.style.width='15%'}
  try{const files=[];const queue=[{id:SET.gdRoot.id,rel:''}];let guard=0;
    while(queue.length&&guard++<300){const f=queue.shift();let tok='';
      do{const r=await gdApi('files',{q:`'${f.id}' in parents and trashed=false`,fields:'nextPageToken,files(id,name,mimeType,size,md5Checksum,modifiedTime,createdTime)',pageSize:'1000',includeItemsFromAllDrives:'true',...(tok?{pageToken:tok}:{})});
        for(const x of r.files||[]){if(x.mimeType==='application/vnd.google-apps.folder')queue.push({id:x.id,rel:f.rel?f.rel+'/'+x.name:x.name});else files.push({...x,rel:f.rel})}
        tok=r.nextPageToken||''}while(tok)}
    const folderOf=x=>x.rel||SET.gdRoot.name;
    const aud=files.filter(x=>isAudio({name:x.name,type:x.mimeType||''})),imgs=files.filter(x=>isImg({name:x.name,type:x.mimeType||''}));
    const hid=new Set(hiddenIds()),seen=new Set();let added=0,updated=0;const fresh=[];
    for(const x of aud){const id='gd:'+x.id;if(hid.has(id))continue;seen.add(id);const folder=folderOf(x),hash=x.md5Checksum||x.modifiedTime;let t=S.byId.get(id);
      if(!t){t={id,src:'gd',gdId:x.id,hash,name:clean(x.name),file:x.name,folder,size:+x.size||0,added:Date.parse(x.createdTime)||Date.now(),plays:0,fav:false,info:{fmt:extOf(x.name).toUpperCase(),lossless:/^(wav|wave|aif|aiff|aifc|flac)$/.test(extOf(x.name))}};
        S.tracks.push(t);S.byId.set(id,t);added++;fresh.push(t);await saveTrack(t)}
      else{let ch=false;if(t.hash!==hash){t.hash=hash;t.size=+x.size||0;t.file=x.name;delete t.peaks;t.duration=0;t.info={fmt:extOf(x.name).toUpperCase()};if(t.offline){await idb.del('blobs',id);t.offline=false}updated++;fresh.push(t);ch=true}
        if(t.folder!==folder){t.folder=folder;ch=true}if(ch)await saveTrack(t)}}
    const gone=S.tracks.filter(t=>t.src==='gd'&&!seen.has(t.id)).map(t=>t.id);if(gone.length)await removeTracks(gone,true);
    if(own().length&&S.tracks.some(t=>t.demo)){if(S.byId.get(S.curId)?.demo){audio.pause();S.curId=null;$('mini').hidden=true}S.tracks=S.tracks.filter(t=>!t.demo);S.byId=new Map(S.tracks.map(t=>[t.id,t]))}
    const byF={};imgs.forEach(x=>{const f=folderOf(x);(byF[f]=byF[f]||[]).push(x)});
    for(const[f,list]of Object.entries(byF)){const pick=list.find(x=>/^(cover|folder|artwork|front|copertina|album)\b/i.test(x.name))||list[0];const h=pick.md5Checksum||pick.modifiedTime;
      if(S.covers[f]&&ls.get('sp-cvh:'+f)===h)continue;try{const d=await imgToData(await gdBlob({gdId:pick.id}));if(d){S.covers[f]=d;await idb.put('meta',d,'cover:'+f);ls.set('sp-cvh:'+f,h)}}catch(e){}}
    ls.set('sp-gd-last',String(Date.now()));render();if(S.curId)updateNow();
    const parts=[];if(added)parts.push(added===1?'1 brano nuovo':`${added} brani nuovi`);if(updated)parts.push(updated===1?'1 aggiornato':`${updated} aggiornati`);if(gone.length)parts.push(`${gone.length} tolti`);
    if(parts.length)toast('Drive: '+parts.join(' · '),3200);else if(manual)toast(aud.length?'Drive: tutto aggiornato':`Nella cartella "${SET.gdRoot.name}" non ci sono ancora brani`,3200);
    dbxDetails(fresh);if(SET.dbxKeep)dbxKeepAll();if(SET.autoDedupe!==false)setTimeout(()=>dedupe(true).then(n=>{if(n)toast(n===1?'1 doppione nascosto':`${n} doppioni nascosti`)}),1200)}
  catch(e){if(e.status===404)toast(`Non trovo più la cartella "${SET.gdRoot.name}": controlla che sia ancora condivisa con il link`,4500);else if(manual)toast('Google Drive non risponde: riprovo quando riapri il player',3500)}
  finally{gdSyncing=false;setTimeout(()=>{P.hidden=true},300)}}

/* ================= Dropbox ================= */
const DBX_KEY='l75j4zke8la7h8o';
const REDIR=location.origin+location.pathname;
let dbx=(()=>{try{return JSON.parse(ls.get('sp-dbx')||'{}')}catch(e){return{}}})();
const saveDbx=()=>ls.set('sp-dbx',JSON.stringify(dbx));
const hdrArg=o=>JSON.stringify(o).replace(/[\u007f-￿]/g,c=>'\\u'+('000'+c.charCodeAt(0).toString(16)).slice(-4));
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function dbxConnect(){if(!DBX_KEY){toast('Dropbox non è ancora configurato');return}
  try{const a=new Uint8Array(48);crypto.getRandomValues(a);const v=b64url(a);ls.set('sp-dbx-v',v);
    const ch=b64url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
    location.href='https://www.dropbox.com/oauth2/authorize?'+new URLSearchParams({client_id:DBX_KEY,response_type:'code',code_challenge:ch,code_challenge_method:'S256',redirect_uri:REDIR,token_access_type:'offline'})}
  catch(e){toast('Apri il player dal link sicuro (https) per collegare Dropbox')}}
async function dbxTokenReq(params){const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body:new URLSearchParams({client_id:DBX_KEY,...params})});
  if(!r.ok)throw Object.assign(new Error('token'),{status:r.status});return r.json()}
async function dbxToken(force){if(!dbx.refresh)throw new Error('nolink');if(!force&&dbx.access&&Date.now()<dbx.exp-60000)return dbx.access;
  if(!dbxToken.p)dbxToken.p=dbxTokenReq({grant_type:'refresh_token',refresh_token:dbx.refresh}).then(j=>{dbx.access=j.access_token;dbx.exp=Date.now()+j.expires_in*1000;saveDbx();return dbx.access},e=>{if(e.status===400||e.status===401){dbx={};saveDbx();toast('Dropbox si è scollegato: ricollegalo dalle impostazioni',4200)}throw e}).finally(()=>{dbxToken.p=null});
  return dbxToken.p}
async function dbxFetch(url,init,retry=true){const tok=await dbxToken();const r=await fetch(url,{...init,headers:{...(init.headers||{}),Authorization:'Bearer '+tok}});
  if(r.status===401&&retry){await dbxToken(true);return dbxFetch(url,init,false)}
  if(r.status===429&&retry){await new Promise(z=>setTimeout(z,(+r.headers.get('Retry-After')||2)*1000));return dbxFetch(url,init,false)}
  if(!r.ok&&r.status!==206){let t='';try{t=await r.text()}catch(e){}throw Object.assign(new Error('dbx '+r.status+' '+t.slice(0,200)),{status:r.status,body:t})}return r}
async function dbxApi(path,body){const init={method:'POST'};if(body!==undefined){init.headers={'Content-Type':'application/json'};init.body=JSON.stringify(body)}
  return (await dbxFetch('https://api.dropboxapi.com/2/'+path,init)).json()}
async function dbxDownload(path,a,b){const h={'Dropbox-API-Arg':hdrArg({path})};if(a!=null)h.Range=`bytes=${a}-${b}`;
  const r=await dbxFetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:h});return a!=null?r.arrayBuffer():r.blob()}
function remoteBlob(t){let head=null;const HEAD=262144;
  const get=async(a,b)=>{if(b<=HEAD&&t.size>0){if(!head)head=await cloudRange(t,0,Math.min(HEAD,t.size)-1);return head.slice(a,Math.min(b,head.byteLength))}return cloudRange(t,a,Math.min(b,t.size)-1)};
  return{size:t.size,type:'',slice:(a,b)=>({arrayBuffer:()=>get(a,b)})}}

async function dbxBoot(){const q=new URLSearchParams(location.search);
  if(q.has('code')||q.has('error')){history.replaceState(null,'',REDIR);
    if(q.has('error')){toast('Collegamento a Dropbox annullato');}
    else{try{const j=await dbxTokenReq({grant_type:'authorization_code',code:q.get('code'),code_verifier:ls.get('sp-dbx-v')||'',redirect_uri:REDIR});
        dbx={refresh:j.refresh_token,access:j.access_token,exp:Date.now()+j.expires_in*1000};saveDbx();ls.del('sp-dbx-v');
        try{const a=await dbxApi('users/get_current_account');dbx.name=a.name&&a.name.display_name;dbx.email=a.email;saveDbx()}catch(e){}
        toast('Dropbox collegato'+(dbx.name?': '+dbx.name:''));setTimeout(()=>dbxFolderSheet(''),500);return}
      catch(e){toast('Collegamento a Dropbox non riuscito: riprova',4000);return}}}
  if(dbx.refresh&&SET.dbxRoot)dbxSync(false)}

  let ents=res.entries;while(res.has_more){res=await dbxApi('files/list_folder/continue',{cursor:res.cursor});ents=ents.concat(res.entries)}
  const dirs=ents.filter(e=>e['.tag']==='folder').sort((a,b)=>a.name.localeCompare(b.name,'it',{numeric:true,sensitivity:'base'}));
  const songs=ents.filter(e=>e['.tag']==='file'&&isAudio({name:e.name,type:''})).length;

    ${path?`<div class="opts"><button class="opt" id="upDir"><span class="lbl">‹ Indietro</span></button></div>`:''}
    <p class="note">Entrano tutti i brani della cartella, anche quelli nelle sottocartelle. Le cartelle condivise compaiono qui dopo averle aggiunte al tuo Dropbox.</p>`,

      saveSet();closeSheet();dbxSync(true)}})}

let dbxSyncing=false;
function dbxFolderOf(e){const rootSeg=SET.dbxRoot.display.split('/').length;const segs=e.path_display.split('/');const mid=segs.slice(rootSeg,-1);return mid.length?mid.join('/'):SET.dbxRoot.name}
async function dbxSync(manual){if(!dbx.refresh||!SET.dbxRoot||dbxSyncing)return;dbxSyncing=true;
  const P=$('prog'),PT=$('progT'),PB=$('progBar');if(manual){P.hidden=false;PT.textContent='Controllo Dropbox…';PB.style.width='15%'}
  try{let res=await dbxApi('files/list_folder',{path:SET.dbxRoot.id||SET.dbxRoot.path,recursive:true,limit:2000});let ents=res.entries;
    while(res.has_more){res=await dbxApi('files/list_folder/continue',{cursor:res.cursor});ents=ents.concat(res.entries)}
    const files=ents.filter(e=>e['.tag']==='file'&&e.is_downloadable!==false);
    const aud=files.filter(e=>isAudio({name:e.name,type:''})),imgs=files.filter(e=>isImg({name:e.name,type:''}));
    const seen=new Set();let added=0,updated=0;const fresh=[];
    const hid=new Set(hiddenIds());
    for(const e of aud){const id='dbx:'+e.id;if(hid.has(id))continue;seen.add(id);const folder=dbxFolderOf(e);let t=S.byId.get(id);
      if(!t){t={id,src:'dbx',dbxId:e.id,hash:e.content_hash,path:e.path_display,name:clean(e.name),file:e.name,folder,size:e.size,added:Date.parse(e.server_modified)||Date.now(),plays:0,fav:false,info:{fmt:extOf(e.name).toUpperCase(),lossless:/^(wav|wave|aif|aiff|aifc|flac)$/.test(extOf(e.name))}};
        S.tracks.push(t);S.byId.set(id,t);added++;fresh.push(t);await saveTrack(t)}
      else{let ch=false;if(t.hash!==e.content_hash){t.hash=e.content_hash;t.size=e.size;t.file=e.name;delete t.peaks;t.duration=0;t.info={fmt:extOf(e.name).toUpperCase()};delete tempLinks[id];
          if(t.offline){await idb.del('blobs',id);t.offline=false}updated++;fresh.push(t);ch=true}
        if(t.path!==e.path_display||t.folder!==folder){t.path=e.path_display;t.folder=folder;ch=true}
        if(ch)await saveTrack(t)}}
    const gone=S.tracks.filter(t=>t.src==='dbx'&&!seen.has(t.id)).map(t=>t.id);
    if(gone.length)await removeTracks(gone,true);
    if(own().length&&S.tracks.some(t=>t.demo)){if(S.byId.get(S.curId)?.demo){audio.pause();S.curId=null;$('mini').hidden=true}S.tracks=S.tracks.filter(t=>!t.demo);S.byId=new Map(S.tracks.map(t=>[t.id,t]))}
    const byF={};imgs.forEach(e=>{const f=dbxFolderOf(e);(byF[f]=byF[f]||[]).push(e)});
    for(const[f,list]of Object.entries(byF)){const pick=list.find(x=>/^(cover|folder|artwork|front|copertina|album)\b/i.test(x.name))||list[0];
      if(S.covers[f]&&ls.get('sp-cvh:'+f)===pick.content_hash)continue;
      try{const d=await imgToData(await dbxDownload(pick.id));if(d){S.covers[f]=d;await idb.put('meta',d,'cover:'+f);ls.set('sp-cvh:'+f,pick.content_hash)}}catch(e){}}
    ls.set('sp-dbx-last',String(Date.now()));render();if(S.curId)updateNow();
    const parts=[];if(added)parts.push(added===1?'1 brano nuovo':`${added} brani nuovi`);if(updated)parts.push(updated===1?'1 aggiornato':`${updated} aggiornati`);if(gone.length)parts.push(`${gone.length} tolti`);
    if(parts.length)toast('Dropbox: '+parts.join(' · '),3200);else if(manual)toast(aud.length?'Dropbox: tutto aggiornato':`Nella cartella "${SET.dbxRoot.name}" non ci sono ancora brani`,3200);
    dbxDetails(fresh);if(SET.dbxKeep)dbxKeepAll();if(SET.autoDedupe!==false)setTimeout(()=>dedupe(true).then(n=>{if(n)toast(n===1?'1 doppione nascosto':`${n} doppioni nascosti`)}),1200)}
  catch(e){if(e&&e.status===409){toast(`Non trovo più la cartella "${SET.dbxRoot.name}" su Dropbox: sceglila di nuovo dalle impostazioni`,4500)}else if(manual||e.message!=='nolink')toast('Dropbox non risponde: riprovo quando riapri il player',3500)}
  finally{dbxSyncing=false;setTimeout(()=>{P.hidden=true},300)}}
async function dbxDetails(list){const q=list.filter(t=>/^wav/.test(extOf(t.file))&&!t.duration);let i=0;
  const work=async()=>{while(i<q.length){const t=q[i++];try{const w=await parseWav(remoteBlob(t));if(w&&S.byId.has(t.id)){t.duration=w.duration;t.info={fmt:'WAV',bits:w.bits,rate:w.rate,ch:w.ch,float:w.tag===3,lossless:true};await saveTrack(t)}}catch(e){}}};
  await Promise.all([work(),work(),work()]);if(q.length)render()}
let keepBusy=false;
async function dbxKeep(t,quiet){if(t.offline)return true;if(!quiet)toast('Scarico "'+t.name+'"…',8000);
  try{const b=await cloudBlob(t);const ok=await idb.put('blobs',b,t.id);if(!ok){toast('Spazio pieno: non riesco a salvarlo sul telefono');return false}
    t.offline=true;await saveTrack(t);render();if(t.id===S.curId)updateNow();if(!quiet)toast('Scaricato: ora si sente anche senza internet');return true}
  catch(e){if(!quiet)toast('Download non riuscito: controlla la connessione');return false}}
async function dbxUnkeep(t,quiet){await idb.del('blobs',t.id);t.offline=false;await saveTrack(t);if(urls[t.id]&&t.id!==S.curId){URL.revokeObjectURL(urls[t.id]);delete urls[t.id]}render();if(t.id===S.curId)updateNow();if(!quiet)toast('Tolto dal telefono: resta su '+cloudName(t))}
async function dbxKeepAll(){if(keepBusy)return;keepBusy=true;try{const q=S.tracks.filter(t=>isCloud(t)&&!t.offline);for(const t of q){if(!SET.dbxKeep)break;if(!(await dbxKeep(t,true)))break}}finally{keepBusy=false}}

/* ================= eventi ================= */
$('seg').onclick=e=>{const b=e.target.closest('button[data-tab]');if(!b)return;S.tab=b.dataset.tab;S.folder=null;render();window.scrollTo(0,0)};
$('back').onclick=()=>{S.tab='folders';S.folder=null;render()};
$('folderMore').onclick=()=>folderMenu(S.folder);
$('grid').onclick=e=>{if(e.target.closest('[data-act="add"]'))return;const c=e.target.closest('[data-folder]');if(c)openFolder(c.dataset.folder)};
$('list').addEventListener('click',e=>{const m=e.target.closest('[data-more]');if(m){e.stopPropagation();trackMenu(m.dataset.more);return}
  const r=e.target.closest('.row');if(!r)return;const id=r.dataset.id;if(id===S.curId){if(audio.paused)toggle();openNp();return}startContext(S.visible,id,$('h1').textContent)});
$('list').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const r=e.target.closest('.row');if(r&&e.target===r)r.click()});
let lpT=null;$('list').addEventListener('touchstart',e=>{const r=e.target.closest('.row');if(!r||e.target.closest('[data-more]'))return;lpT=setTimeout(()=>{lpT='done';try{navigator.vibrate&&navigator.vibrate(10)}catch(x){}trackMenu(r.dataset.id)},550)},{passive:true});
['touchmove','touchcancel'].forEach(ev=>$('list').addEventListener(ev,()=>{if(lpT!=='done'){clearTimeout(lpT);lpT=null}},{passive:true}));
$('list').addEventListener('touchend',e=>{if(lpT==='done')e.preventDefault();else clearTimeout(lpT);lpT=null});
$('list').addEventListener('contextmenu',e=>{const r=e.target.closest('.row');if(r){e.preventDefault();trackMenu(r.dataset.id)}});
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;if(a.dataset.act==='add')addSheet();if(a.dataset.act==='dedupe')dedupe(false);if(a.dataset.act==='goFolders'){S.tab='folders';S.folder=null;render();window.scrollTo(0,0)}});
$('q').oninput=e=>{S.query=e.target.value;render()};
$('sortBtn').onclick=()=>sheetOptions('Ordina per',Object.entries(SORTS).map(([k,l])=>({label:l,sel:SET.sort===k,fn:()=>{SET.sort=k;saveSet();render()}})));
$('playAll').onclick=()=>{if(!S.visible.length)return;if(S.shuffle){S.shuffle=false;syncModes()}startContext(S.visible,S.visible[0],$('h1').textContent)};
$('shufAll').onclick=()=>{if(!S.visible.length)return;S.shuffle=true;syncModes();startContext(S.visible,S.visible[Math.floor(Math.random()*S.visible.length)],$('h1').textContent)};
$('addBtn').onclick=addSheet;$('setBtn').onclick=settingsSheet;
const fromInput=files=>[...files].map(f=>({file:f,path:f.webkitRelativePath||f.name}));
$('fileIn').addEventListener('change',e=>{if(!$('sheet').hidden)closeSheet();const l=fromInput(e.target.files||[]);e.target.value='';if(!l.length){toast('Nessun file selezionato');return}importEntries(l)});
$('dirIn').addEventListener('change',e=>{if(!$('sheet').hidden)closeSheet();const l=fromInput(e.target.files||[]);e.target.value='';if(!l.length){toast('La cartella è vuota o il telefono non permette di sceglierla: usa "Scegli i brani"',4500);return}importEntries(l)});
$('miniPlay').onclick=$('play').onclick=toggle;$('miniNext').onclick=$('next').onclick=()=>next(false);$('prev').onclick=prev;
$('openNp').onclick=openNp;$('closeNp').onclick=closeNp;$('queueBtn').onclick=queueSheet;
$('npFav').onclick=()=>{const t=S.byId.get(S.curId);if(t)setFav(t,!t.fav)};
$('npShare').onclick=()=>{const t=S.byId.get(S.curId);if(t)shareTrack(t)};
$('npMore').onclick=()=>S.curId&&trackMenu(S.curId);
$('notes').oninput=e=>{if(S.curId)ls.set('sp-notes:'+S.curId,e.target.value)};
document.addEventListener('keydown',e=>{const tag=document.activeElement&&document.activeElement.tagName;if(/INPUT|TEXTAREA/.test(tag))return;
  if(e.key==='Escape'){if(!$('sheet').hidden)closeSheet();else closeNp()}
  else if(e.code==='Space'){e.preventDefault();toggle()}
  else if(e.key==='ArrowRight'&&e.shiftKey)next(false);else if(e.key==='ArrowLeft'&&e.shiftKey)prev();
  else if(e.key==='ArrowRight'&&S.curId&&document.activeElement!==wv)audio.currentTime=Math.min(audio.duration||0,audio.currentTime+5);
  else if(e.key==='ArrowLeft'&&S.curId&&document.activeElement!==wv)audio.currentTime=Math.max(0,audio.currentTime-5)});
/* trascina cartelle o file (computer) */
let dragN=0;
document.addEventListener('dragenter',e=>{if([...(e.dataTransfer?.types||[])].includes('Files')){dragN++;$('drop').hidden=false}});
document.addEventListener('dragleave',()=>{dragN=Math.max(0,dragN-1);if(!dragN)$('drop').hidden=true});
document.addEventListener('dragover',e=>{if([...(e.dataTransfer?.types||[])].includes('Files'))e.preventDefault()});
document.addEventListener('drop',async e=>{if(!e.dataTransfer||!e.dataTransfer.files.length)return;e.preventDefault();dragN=0;$('drop').hidden=true;importEntries(await entriesFromDrop(e.dataTransfer))});
document.addEventListener('visibilitychange',()=>{if(document.hidden)savePos();else{if(dbx.refresh&&SET.dbxRoot&&Date.now()-(+ls.get('sp-dbx-last')||0)>60000)dbxSync(false);if(SET.gdRoot&&Date.now()-(+ls.get('sp-gd-last')||0)>60000)gdSync(false)}});
window.addEventListener('pagehide',savePos);

/* ================= avvio ================= */
(async()=>{applySettings();syncModes();syncPlay();updTimer();
  const metas=await idb.all('tracks');
  try{const keys=await idb.keys('meta');for(const k of keys)if(String(k).startsWith('cover:'))S.covers[String(k).slice(6)]=await idb.get('meta',k)}catch(e){}
  S.tracks=metas.length?metas:DEMOS.map(d=>({...d}));S.byId=new Map(S.tracks.map(t=>[t.id,t]));render();
  try{const r=JSON.parse(ls.get('sp-resume')||'null');if(r&&S.byId.has(r.id)){S.ctx=(r.ctx||[]).filter(id=>S.byId.has(id));if(!S.ctx.includes(r.id))S.ctx=[r.id];S.ctxBase=[...S.ctx];S.pos=S.ctx.indexOf(r.id);S.ctxLabel=r.label||'';
    S.curId=r.id;lastPos=r.t||0;$('mini').hidden=false;updateNow();render();
    const t=S.byId.get(r.id),d=t.duration||0;$('miniProg').style.width=(d?lastPos/d*100:0)+'%';$('cur').textContent=fmt(lastPos);$('rem').textContent='-'+fmt(d-lastPos)}}catch(e){}
  await gdBoot();
  await dbxBoot();
})();
</script>
